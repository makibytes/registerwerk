apiVersion: v2
name: registerwerk
description: Registerwerk eWpG electronic securities registry
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords: [ewpg, securities, registry, tokenization]
maintainers:
  - name: Maki Bytes
dependencies:
  - name: postgresql
    repository: https://charts.bitnami.com/bitnami
    version: "~15.5"
    condition: postgresql.enabled
  - name: kong
    repository: https://charts.konghq.com
    version: "~2.38"
    condition: kong.enabled
  # Phase 5: backs Kong's rate-limiting plugin (policy: redis in files/kong.yml) so the
  # request-per-minute/hour throttle is a real, fleet-wide limit across every Kong replica —
  # policy: local (the previous default) counts per-node, so N Kong replicas silently multiplied
  # the effective limit by N. Kong OSS's proxy-cache plugin has no Redis-backed strategy at all
  # (that needs the Enterprise-only proxy-cache-advanced plugin) — this Redis is NOT used for
  # response caching, only rate-limiting counters.
  - name: redis
    repository: https://charts.bitnami.com/bitnami
    version: "~19.6"
    condition: redis.enabled
