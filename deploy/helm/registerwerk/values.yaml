replicaCount: 3

image:
  repository: ghcr.io/makibytes/registerwerk/backend
  pullPolicy: IfNotPresent
  tag: ""  # defaults to .Chart.AppVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: /actuator/prometheus

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false  # wallets dir needs write

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
  hosts:
    - host: api.registerwerk.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: registerwerk-tls
      hosts: [api.registerwerk.example.com]

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: 2000m
    memory: 1500Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: registerwerk
        topologyKey: kubernetes.io/hostname

env:
  REGISTERWERK_PRODUCTION_MODE: "true"
  SWAGGER_ENABLED: "false"
  OTEL_SAMPLING_PROBABILITY: "0.10"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"

envFromSecrets:
  - name: registerwerk-secrets
    keys:
      - DB_PASSWORD
      - JWT_DEV_SECRET
      - REGISTERWERK_WALLET_MASTER_KEY
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - MAIL_PASSWORD
      - DEFAULT_ADMIN_EMAIL
      - DEFAULT_ADMIN_PASSWORD

wallets:
  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
    accessMode: ReadWriteOnce

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 3

postgresql:
  enabled: true
  auth:
    database: registerwerk
    username: registerwerk
    existingSecret: registerwerk-postgres-secret
  primary:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      requests:
        memory: 1Gi
        cpu: 500m

kong:
  enabled: true
  proxy:
    tls:
      enabled: true
  admin:
    enabled: false  # access via kubectl port-forward only

networkPolicy:
  enabled: true
  # Backend only reachable from Kong and monitoring
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
