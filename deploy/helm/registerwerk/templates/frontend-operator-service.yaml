{{- if .Values.frontendOperator.enabled }}
{{- $ctx := dict "context" . "component" "frontend-operator" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "registerwerk.componentFullname" $ctx }}
  labels:
    {{- include "registerwerk.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.frontendOperator.service.type }}
  ports:
    - port: {{ .Values.frontendOperator.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "registerwerk.componentSelectorLabels" $ctx | nindent 4 }}
{{- end }}
