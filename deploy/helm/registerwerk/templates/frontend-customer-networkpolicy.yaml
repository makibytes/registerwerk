{{- if and .Values.networkPolicy.enabled .Values.frontendCustomer.enabled }}
{{- $ctx := dict "context" . "component" "frontend-customer" }}
# Companion to templates/networkpolicy.yaml (the backend's own NetworkPolicy) — see the operator
# frontend's identical NetworkPolicy for why this Deployment needs its own admission rule for the
# ingress controller rather than inheriting the backend's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "registerwerk.componentFullname" $ctx }}
  labels:
    {{- include "registerwerk.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "registerwerk.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.frontendCustomer.ingress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow the reverse proxy's own `location /api/` (files/frontend-customer-nginx.conf.tpl) to
    # reach Kong's proxy — per CLAUDE.md, "customer frontend's API calls go through Kong", never
    # the backend Service directly (that's the operator frontend's path, not this one).
    {{- if .Values.kong.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8000
    {{- end }}
{{- end }}
