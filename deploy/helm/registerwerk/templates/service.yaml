{{- $ctx := dict "context" . "component" "backend" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "registerwerk.fullname" . }}
  labels:
    {{- include "registerwerk.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      appProtocol: http
  {{/* componentSelectorLabels (component: backend), not the bare selectorLabels — otherwise this
       Service round-robins traffic into every frontend-operator/frontend-customer/zama-relayer
       pod too, since they all carry app.kubernetes.io/{name,instance} as a subset of their own
       labels. See _helpers.tpl's comment on registerwerk.componentSelectorLabels. */}}
  selector:
    {{- include "registerwerk.componentSelectorLabels" $ctx | nindent 4 }}
