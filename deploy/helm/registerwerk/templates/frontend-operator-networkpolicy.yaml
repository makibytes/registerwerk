{{- if and .Values.networkPolicy.enabled .Values.frontendOperator.enabled }}
{{- $ctx := dict "context" . "component" "frontend-operator" }}
# Companion to templates/networkpolicy.yaml (the backend's own NetworkPolicy). That file's own
# comment documents the ledger finding this chart already hit once for the backend: an
# ingress.enabled Ingress resource routing traffic that NetworkPolicy.enabled then silently drops
# at the network layer, because nothing admitted the ingress-controller's pods. The same gap exists
# for this Deployment now that it has its own Ingress (templates/frontend-operator-ingress.yaml) —
# admitting the ingress controller here, explicitly, rather than assuming "it's covered by the
# backend's policy" (NetworkPolicy is scoped per podSelector; the backend's policy only ever
# governed the backend's own pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "registerwerk.componentFullname" $ctx }}
  labels:
    {{- include "registerwerk.componentLabels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "registerwerk.componentSelectorLabels" $ctx | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.frontendOperator.ingress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 80
    {{- end }}
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow the reverse proxy's own `location /api/` (files/frontend-operator-nginx.conf.tpl) to
    # reach the backend Service directly — this is the in-cluster equivalent of "operator frontend
    # bypasses Kong" (CLAUDE.md); Kong is deliberately not in this egress path at all.
    #
    # componentSelectorLabels (component: backend), not the bare selectorLabels — the bare version
    # would over-permit egress to every component's pods in the release, not just the backend.
    - to:
        - podSelector:
            matchLabels:
              {{- include "registerwerk.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
