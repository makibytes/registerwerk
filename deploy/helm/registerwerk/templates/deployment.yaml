apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "registerwerk.fullname" . }}
  labels:
    {{- include "registerwerk.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "registerwerk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "registerwerk.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "registerwerk.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.postgresql.enabled }}
            {{/* Bitnami's postgresql subchart (no fullnameOverride set) names its primary
                 Service "<release-name>-postgresql" — nothing else in this chart previously
                 set DB_URL/DB_USER at all, so the backend would fall back to
                 application.yml's localhost:5432 default, which doesn't resolve in a real
                 cluster. */}}
            - name: DB_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            - name: DB_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            {{/* Reads straight from the Postgres subchart's own existingSecret/key
                 (postgresql.auth.existingSecret / secretKeys.userPasswordKey, default
                 "password") instead of expecting a second, manually-kept-in-sync copy under
                 DB_PASSWORD in registerwerk-secrets — previously nothing wired this at all, so
                 an operator following secret.yaml's "create the Secret manually" instructions
                 would set DB_PASSWORD to whatever they typed, completely independent of
                 whatever registerwerk-postgres-secret's "password" key actually contained,
                 and the backend would fail to authenticate unless the two happened to match
                 by luck (ledger finding: "PostgreSQL secret keys referenced by Helm do not
                 agree"). */}}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}
            {{- end }}
          envFrom:
            - secretRef:
                name: registerwerk-secrets
                optional: false
          {{- if .Values.wallets.persistence.enabled }}
          volumeMounts:
            - name: wallets
              mountPath: /data/wallets
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.wallets.persistence.enabled }}
      volumes:
        - name: wallets
          persistentVolumeClaim:
            claimName: {{ include "registerwerk.fullname" . }}-wallets
      {{- end }}
