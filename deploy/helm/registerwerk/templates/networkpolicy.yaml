{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "registerwerk.fullname" . }}
  labels:
    {{- include "registerwerk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "registerwerk.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
    {{- if .Values.ingress.enabled }}
    # Admits the cluster's ingress controller — see the comment on networkPolicy above for
    # why this is required whenever ingress.enabled is true.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Postgres
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    # Allow Kong upstream health checks and KMS
    - ports:
        - port: 443
          protocol: TCP
        - port: 8080
          protocol: TCP
{{- end }}
