{{- if .Values.ingress.enabled -}}
{{- /* The API host must never point straight at the backend by accident (7B-02): default target is
       Kong's proxy Service; with kong.enabled=false an explicit ingress.backendService is required. */ -}}
{{- $backendName := .Values.ingress.backendService -}}
{{- $backendPort := .Values.ingress.backendPort -}}
{{- if not $backendName -}}
{{- if .Values.kong.enabled -}}
{{- $backendName = printf "%s-kong-proxy" .Release.Name -}}
{{- else -}}
{{- fail "ingress.enabled requires kong.enabled=true or an explicit ingress.backendService (the API ingress never defaults to the backend Service)" -}}
{{- end -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "registerwerk.fullname" . }}
  labels:
    {{- include "registerwerk.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.ingress.certManagerClusterIssuer }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.certManagerClusterIssuer }}
    # Previously there was no cert-manager integration at all — the TLS secret referenced
    # below was assumed to pre-exist, provisioned entirely out-of-band with nothing automating
    # renewal . cert-manager's ingress-shim watches for this annotation
    # and automatically provisions/renews that secret once cert-manager + this ClusterIssuer
    # are installed in the cluster (not something this chart can install for you).
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManagerClusterIssuer }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $backendName }}
                port:
                  number: {{ $backendPort }}
          {{- end }}
    {{- end }}
{{- end }}
