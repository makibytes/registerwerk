{{- /*
  External secret reference template.
  Registerwerk uses ExternalSecrets (external-secrets.io) or Sealed Secrets
  to inject the registerwerk-secrets Secret from Vault/AWS Secrets Manager.
  This file provides the ExternalSecret CRD reference.
  If ExternalSecrets is not installed, create the Secret manually:

  kubectl create secret generic registerwerk-secrets \
    --from-literal=DB_USER=... \
    --from-literal=JWT_DEV_SECRET=... \
    --from-literal=REGISTERWERK_WALLET_MASTER_KEY=... \
    --from-literal=S3_ACCESS_KEY=... \
    --from-literal=S3_SECRET_KEY=... \
    --from-literal=MAIL_PASSWORD=... \
    --from-literal=DEFAULT_ADMIN_EMAIL=... \
    --from-literal=DEFAULT_ADMIN_PASSWORD=... \
    --from-literal=WALLETS_BACKUP_RESTIC_PASSWORD=...

  Note: DB_USER and WALLETS_BACKUP_RESTIC_PASSWORD are read by the companion
  deploy/helm/backup chart's CronJobs (a separate Helm release) — they must exist in this
  same Secret even though the main registerwerk chart's own deployment.yaml sets DB_USER as
  a plain (non-secret) value directly from postgresql.auth.username, not from this Secret.

  DB_PASSWORD is deliberately NOT in this Secret: deployment.yaml reads it straight from
  postgresql.auth.existingSecret (values.yaml: "registerwerk-postgres-secret", key "password")
  — the same Secret+key the Postgres subchart itself authenticates the "registerwerk" user
  with — so there is exactly one place the password lives, not two copies that can drift out
  of sync. Create that Secret (with the Postgres subchart disabled, or pre-created before
  `helm install` if it manages its own) as:

  kubectl create secret generic registerwerk-postgres-secret \
    --from-literal=password=...

  if zamaRelayer.enabled is turned on (values.yaml, default false), also create the
  Secret named by zamaRelayer.existingSecret (default "registerwerk-zama-relayer-secret").
  OPERATOR_DECRYPT_PRIVATE_KEY is a dedicated decrypt-only viewer key — deliberately NOT any
  chain's on-chain transaction-signing wallet (registry wallets are configured via Operator
  Portal → Wallets instead); its public address must separately be registered as a viewer
  (addViewer / deploy-time initialViewers) on any confidential token the operator needs to
  reconcile. RELAYER_API_KEY is a shared bearer credential every zama-relayer /v1/* caller must
  present (zama-relayer/src auth.ts) — both this Secret's copy and the backend Deployment's
  REGISTERWERK_ZAMA_RELAYER_API_KEY env var read the SAME key from THIS Secret
  (templates/deployment.yaml, templates/zama-relayer-deployment.yaml), so there is exactly one
  place this credential lives, not two copies that can drift out of sync:

  kubectl create secret generic registerwerk-zama-relayer-secret \
    --from-literal=OPERATOR_DECRYPT_PRIVATE_KEY=... \
    --from-literal=RELAYER_API_KEY=...
*/ -}}
# ExternalSecret — uncomment and configure when external-secrets operator is installed.
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: registerwerk-secrets
# spec:
#   secretStoreRef:
#     name: vault-backend   # or aws-secretsmanager
#     kind: ClusterSecretStore
#   target:
#     name: registerwerk-secrets
#   data:
#     - secretKey: DB_PASSWORD
#       remoteRef: { key: registerwerk/prod, property: db_password }
#     - secretKey: REGISTERWERK_WALLET_MASTER_KEY
#       remoteRef: { key: registerwerk/prod, property: wallet_master_key }
#     # ... add remaining keys
