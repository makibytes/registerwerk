# Static MkDocs site. Serves the output of `mkdocs build` — no watcher, no rebuild.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    # MkDocs emits directory URLs (/intro/architecture/), each backed by an index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Unlike Material's fingerprinted theme assets, this small local helper has a stable filename.
    # Revalidating it prevents a browser from retaining an old language-switch implementation for
    # the 30-day generic asset cache period after a docs image is rebuilt.
    location = /assets/language-switcher-origin.js {
        expires -1;
    }

    # The theme's JS/CSS/fonts carry a build hash in the filename, so they are safe to pin.
    location ~* \.(js|css|woff2|woff|ttf|svg|png|jpg|ico)$ {
        expires 30d;
        access_log off;
    }

    # HTML must revalidate, otherwise a rebuilt image serves stale pages from browser cache.
    location ~* \.html$ {
        expires -1;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    error_page 404 /404.html;
}
