name: Scan a container image
description: >-
  Scans an image with Trivy at the one release this repository pins and fails on HIGH or CRITICAL
  findings. The SARIF report is uploaded to code scanning even when the gate fails.

# The Trivy release is literal here (not an input) so every scan in the repository moves together.
# Bump `version` below, and the table in docs/platform/continuous-integration.md.
#
# The calling job needs `security-events: write` for the SARIF upload.

inputs:
  image-ref:
    description: Image to scan (local tag or registry reference).
    required: true
  sarif:
    description: >-
      Name of the SARIF report. Trivy writes it into the workspace root, not into the job's default
      working directory.
    required: true

runs:
  using: composite
  steps:
    - name: Trivy image scan
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        version: v0.76.0
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        format: sarif
        output: ${{ inputs.sarif }}
        severity: HIGH,CRITICAL
        limit-severities-for-sarif: true
        exit-code: "1"

    # `hashFiles()` is not a documented function in composite-action step conditions, so look for the
    # report explicitly. A failed scan or a Trivy error can leave no report to upload.
    - name: Look for the SARIF report
      id: report
      if: always()
      shell: bash
      env:
        SARIF: ${{ inputs.sarif }}
      run: |
        if [ -f "$GITHUB_WORKSPACE/$SARIF" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

    - name: Upload Trivy SARIF
      if: always() && steps.report.outputs.found == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif }}
