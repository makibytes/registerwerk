name: Indexers CI

on:
  push:
    branches: [main, feat/**, fix/**, develop, review/**]
    paths: [indexer/**, .github/workflows/indexers.yml]
  pull_request:
    branches: [main, develop]
    paths: [indexer/**, .github/workflows/indexers.yml]

concurrency:
  group: indexers-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The EVM subgraph is the only indexer with its own buildable/testable source (mapping.ts
  # handlers, manifest templating, ABI parity checks) — see indexer/evm/subgraph/package.json's
  # `test` script, which chains ABI-parity validation, manifest-render tests, codegen, and a
  # full `graph build`. The Solana/Starknet/Canton/Stellar indexers are config + a
  # docker-compose service each (no custom source to build here); their runtime behavior is
  # exercised via IndexerMonitorService in the backend's own test suite, not here.
  evm-subgraph:
    name: EVM Subgraph — ABI Parity, Manifest, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: indexer/evm/subgraph
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/contract-libs
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: indexer/evm/subgraph/package-lock.json
      # `npm test` starts with validate-abi-parity.mjs, which diffs the checked-in subgraph ABIs
      # against the canonical Forge artifacts under contracts/out (gitignored), so the contracts
      # must be built first.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      - name: Build contracts (canonical ABIs)
        run: forge build
        working-directory: contracts
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run audit:build-tools
      - run: npm test
