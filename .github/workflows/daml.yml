name: Daml (Canton) CI

on:
  push:
    branches: [main, feat/**, fix/**, develop, review/**]
    paths: [daml/**, .github/workflows/daml.yml]
  pull_request:
    branches: [main, develop]
    paths: [daml/**, .github/workflows/daml.yml]

concurrency:
  group: daml-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dpm-build:
    name: dpm Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daml
    steps:
      - uses: actions/checkout@v7

      # dpm (Daml Package Manager, digital-asset/dpm) is the drop-in replacement for the
      # deprecated classic `daml` assistant. Installed from the pinned GitHub release tarball
      # rather than a curl-to-shell script, so this step is reproducible and doesn't silently
      # pick up a newer major version. dpm itself does NOT fetch the SDK on `dpm build`: it
      # stops with SDK_NOT_INSTALLED, hence the explicit SDK-install step below.
      - name: Install dpm
        env:
          DPM_VERSION: "1.0.21"
        run: |
          curl -fsSL -o dpm.tar.gz \
            "https://github.com/digital-asset/dpm/releases/download/${DPM_VERSION}/dpm-${DPM_VERSION}-linux-amd64.tar.gz"
          tar -xzf dpm.tar.gz
          chmod +x dpm
          sudo mv dpm /usr/local/bin/dpm
          rm dpm.tar.gz

      # With no argument `dpm install` is `dpm install package`: it installs the SDK pinned by
      # sdk-version in daml/daml.yaml (3.5.2), so the version is not repeated here. The test
      # package (daml/test) pins the same SDK.
      - name: Install the Daml SDK pinned in daml.yaml
        run: dpm install

      - name: Build
        run: dpm build

      # Daml Script tests live in a separate package (daml/test) so the production DAR takes
      # no daml-script dependency; it data-depends on the DAR built above.
      - name: Daml Script tests
        working-directory: daml/test
        run: dpm test
