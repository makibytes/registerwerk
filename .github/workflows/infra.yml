name: Infra Config CI

# Config-only validation for the pieces that have no other CI coverage: docker-compose files,
# Kong's declarative config (both the Compose copy and its Helm-chart mirror, which must stay
# identical per the SYNC NOTE at the top of deploy/helm/registerwerk/files/kong.yml), and both
# Helm charts. None of this spins up the actual stack (see the "docker compose up" verification
# in Track 0's own testing, done manually) — it only catches config that's syntactically or
# structurally broken before it reaches a real deploy.

on:
  push:
    branches: [main, feat/**, fix/**, develop, review/**]
    paths:
      - docker-compose.yml
      - monitoring/docker-compose.yml
      - gateway/kong.yml
      - deploy/helm/**
      - monitoring/**
      - scripts/lint-placeholders.sh
      - scripts/check-alert-metrics.sh
      - scripts/docker-build-retry.sh
      - scripts/docker-hub-mirror.sh
      - scripts/test-docker-build-retry.sh
      - backend/src/main/java/**
      - backend/src/main/resources/application.yml
      # Any workflow or composite-action edit is linted (the "workflows" job); previously only an edit
      # of this very file triggered it, so a broken backend.yml was never actionlint-checked.
      - .github/workflows/**
      - .github/actions/**
  pull_request:
    branches: [main, develop]
    paths:
      - docker-compose.yml
      - monitoring/docker-compose.yml
      - gateway/kong.yml
      - deploy/helm/**
      - monitoring/**
      - scripts/lint-placeholders.sh
      - scripts/check-alert-metrics.sh
      - scripts/docker-build-retry.sh
      - scripts/docker-hub-mirror.sh
      - scripts/test-docker-build-retry.sh
      - backend/src/main/java/**
      - backend/src/main/resources/application.yml
      - .github/workflows/**
      - .github/actions/**

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose Config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate root compose file
        run: docker compose config -q
      - name: Validate root compose file with the docs profile
        run: docker compose --profile docs config -q
      - name: Validate root compose file with the chaincache-true profile
        run: docker compose --profile chaincache-true config -q
      - name: Validate the monitoring compose file
        run: docker compose -f monitoring/docker-compose.yml config -q

  kong-config:
    name: Kong Declarative Config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: "v3.16.3"
      - name: Parse gateway/kong.yml
        run: |
          docker run --rm -e KONG_DATABASE=off \
            -v "$PWD/gateway/kong.yml:/kong.yml:ro" \
            kong:3.9.3 kong config parse /kong.yml
      # Must stay identical to gateway/kong.yml (Helm can only read files inside its own chart
      # directory, so this is a separate copy — see the SYNC NOTE at the top of the file).
      # The copy is a Helm template (the ip-restriction allow list is a `{{- range }}` over
      # kong.adminAllowCidrs), so the file itself is not valid YAML: render it with the CI test
      # values and parse what Helm would actually ship to Kong.
      - name: Parse the rendered deploy/helm/registerwerk/files/kong.yml
        working-directory: deploy/helm/registerwerk
        run: |
          helm template test . -f values.yaml -f ci/test-values.yaml --show-only templates/kong-configmap.yaml \
            | sed -n '/kong.yml: |-/,$p' | tail -n +2 | sed 's/^    //' > "$RUNNER_TEMP/helm-kong.yml"
          docker run --rm -e KONG_DATABASE=off \
            -v "$RUNNER_TEMP/helm-kong.yml:/kong.yml:ro" \
            kong:3.9.3 kong config parse /kong.yml

  helm:
    name: Helm Lint & Template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: "v3.16.3"

      # Static binary, matching this repo's existing pattern of pinning exact tool versions
      # (dpm in daml.yml, wal-g/restic images in the backup chart) rather than tracking `latest`.
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          rm kubeconform.tar.gz

      # No `helm dependency build` needed: charts/*.tgz (kong, postgresql, redis) are already
      # vendored and committed, so lint/template resolve against them directly without touching a
      # chart repository.
      #
      # Three render passes for the main chart, each piped straight into kubeconform against the
      # real Kubernetes OpenAPI schemas (not just "is this valid YAML" — catches a typo'd field
      # name, a wrong apiVersion, or a value of the wrong type that `helm template` itself never
      # notices since it's just string templating): the fresh-install defaults, the same defaults
      # with the zama-relayer sidecar turned on (its own Deployment/Service/NetworkPolicy
      # templates are otherwise never rendered by CI at all), and the production overlay layered
      # on top with the relayer enabled too, matching the fullest real-world combination.
      - name: Lint & template & validate the main chart
        working-directory: deploy/helm/registerwerk
        run: |
          helm lint . -f values.yaml -f ci/test-values.yaml
          helm lint . -f values.yaml -f values-production.yaml -f ci/test-values.yaml
          helm template test . -f values.yaml -f ci/test-values.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.31.0
          helm template test . -f values.yaml -f ci/test-values.yaml --set zamaRelayer.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.31.0
          helm template test . -f values.yaml -f values-production.yaml -f ci/test-values.yaml --set zamaRelayer.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.31.0
      # postgresql.host/pvcName are marked REQUIRED in values.yaml with a `fail` guard when
      # unset (they're derived from the main chart's release name at install time, which this
      # chart deliberately can't compute on its own — see the comment in values.yaml) — set
      # placeholders here purely so the template step can render.
      - name: Lint & template & validate the backup chart
        working-directory: deploy/helm/backup
        run: |
          helm lint . --set postgresql.host=placeholder --set postgresql.pvcName=placeholder --set postgresql.existingSecret=placeholder
          helm template test . --set postgresql.host=placeholder --set postgresql.pvcName=placeholder --set postgresql.existingSecret=placeholder \
            | kubeconform -strict -summary -kubernetes-version 1.31.0

      # Regression assertions for 7B-01 / 7B-02 / 8B-08 hooks on the rendered default chart.
      - name: Assert ingress, Kong and required-value rules
        working-directory: deploy/helm/registerwerk
        run: |
          helm template test . -f values.yaml -f ci/test-values.yaml > /tmp/default.yaml
          # The API ingress must target Kong, never the backend Service.
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/default.yaml')) if d]
          ing = next(d for d in docs if d['kind'] == 'Ingress' and d['metadata']['name'] == 'test-registerwerk')
          svc = ing['spec']['rules'][0]['http']['paths'][0]['backend']['service']['name']
          assert svc == 'test-kong-proxy', svc
          snippet = ing['metadata']['annotations']['nginx.ingress.kubernetes.io/server-snippet']
          assert '/actuator/' in snippet and 'return 404' in snippet, snippet
          PY
          # Required values must fail when missing.
          if helm template test . -f values.yaml 2>/dev/null; then echo 'defaults must not render'; exit 1; fi
          if helm template test . -f values.yaml -f ci/test-values.yaml --set kong.adminAllowCidrs=null 2>/dev/null; then echo 'adminAllowCidrs must be required'; exit 1; fi
          if helm template test . -f values.yaml -f ci/test-values.yaml --set env.REGISTERWERK_AUTH_TRUSTED_PROXIES= 2>/dev/null; then echo 'trusted proxies must be required (no private-range default)'; exit 1; fi
          if helm template test . -f values.yaml -f ci/test-values.yaml --set kong.enabled=false 2>/dev/null; then echo 'ingress without Kong must need backendService'; exit 1; fi
          # Generic hooks render.
          helm template test . -f values.yaml -f ci/test-values.yaml \
            --set 'extraVolumes[0].name=hsm,extraVolumes[0].emptyDir={}' | grep -q 'name: hsm'
      - name: Placeholder lint (production values only)
        run: scripts/lint-placeholders.sh deploy/helm/registerwerk/values-production.yaml

  kong-sync:
    name: Kong Copies In Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: "v3.16.3"
      # The Helm copy is a template: render it with test values, then compare with gateway/kong.yml
      # with comments stripped, the redis host line and the ip-restriction allow list (deliberately
      # different: rendered from kong.adminAllowCidrs / compose-demo ranges) normalised.
      - name: Diff gateway/kong.yml against the rendered Helm copy
        working-directory: deploy/helm/registerwerk
        run: |
          helm template test . -f values.yaml -f ci/test-values.yaml --show-only templates/kong-configmap.yaml \
            | sed -n '/kong.yml: |-/,$p' | tail -n +2 | sed 's/^    //' > /tmp/helm-kong.yml
          norm() {
            grep -v '^[[:space:]]*#' "$1" | sed -E '/^[[:space:]]*$/d; s/host: (redis|registerwerk-redis-master)$/host: REDIS/' \
              | awk '/^[[:space:]]+allow:$/ {print; skip=1; next} skip && /^[[:space:]]+message:/ {skip=0} !skip {print}'
          }
          diff <(norm "$GITHUB_WORKSPACE/gateway/kong.yml") <(norm /tmp/helm-kong.yml)

  alerting:
    name: Prometheus & Alertmanager Config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules + config
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v3.5.0 \
            check rules /m/alerts/registerwerk.yml /m/alerts/chaincache.yml
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v3.5.0 \
            check config /m/prometheus.yml
      - name: promtool unit tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v3.5.0 \
            test rules /m/alerts/tests/registerwerk.test.yml
      - name: amtool check-config
        run: |
          docker run --rm --entrypoint amtool -v "$PWD/monitoring:/m:ro" prom/alertmanager:v0.28.1 \
            check-config /m/alertmanager.yml
      # Every registerwerk_* name in alerts, promtool tests, dashboards and the charts must be a meter
      # the backend registers (a gauge `x_total` is exposed as `x`; a counter `x` as `x_total`).
      - name: Alert/dashboard metric names resolve to backend meters
        run: scripts/check-alert-metrics.sh -v

  workflows:
    name: Workflow Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # The Docker build wrapper every container job depends on; tested against a stub `docker`, so a
  # regression in its retry rules shows up here instead of as a mysteriously slow or flaky build.
  build-scripts:
    name: Docker Build Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-docker-build-retry.sh
