name: Zama Relayer CI

on:
  push:
    branches: [main, feat/**, fix/**, develop, review/**]
    paths: [zama-relayer/**, scripts/docker-build-retry.sh, scripts/docker-hub-mirror.sh, .github/workflows/relayer.yml, .github/actions/trivy-image-scan/**]
  pull_request:
    branches: [main, develop]
    paths: [zama-relayer/**, scripts/docker-build-retry.sh, scripts/docker-hub-mirror.sh, .github/workflows/relayer.yml, .github/actions/trivy-image-scan/**]

permissions:
  contents: read

concurrency:
  group: relayer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relayer:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # SARIF upload of the image scan
    defaults:
      run:
        working-directory: zama-relayer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: zama-relayer/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build production container
        run: ../scripts/docker-build-retry.sh -t registerwerk-zama-relayer:ci .
      - name: Scan production container
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: registerwerk-zama-relayer:ci
          sarif: trivy-relayer.sarif

  # github/codeql-action was previously used ONLY as a SARIF uploader for the Trivy
  # image scan above — actual CodeQL static analysis of the TypeScript source never ran.
  codeql-typescript:
    name: CodeQL (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          source-root: zama-relayer

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript-relayer"
