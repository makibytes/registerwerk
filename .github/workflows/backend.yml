name: Backend CI

on:
  push:
    branches: [main, feat/**, fix/**, release/**]
    paths: [backend/**, .github/workflows/backend.yml]
  pull_request:
    branches: [main]
    paths: [backend/**, .github/workflows/backend.yml]

permissions:
  contents: read
  security-events: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: registerwerk_test
          POSTGRES_USER: registerwerk
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U registerwerk"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build and verify (tests + JaCoCo)
        run: ./mvnw verify -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/registerwerk_test
          DB_USER: registerwerk
          DB_PASSWORD: testpassword
          JWT_DEV_SECRET: ci-test-jwt-secret-not-for-production-use-at-all
          REGISTERWERK_WALLET_MASTER_KEY: ci-wallet-master-key-32-chars-min

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  sast:
    name: SAST & SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: OWASP Dependency-Check
        run: ./mvnw org.owasp:dependency-check-maven:check -B
             -Ddependency-check.failBuildOnCVSS=7
             -Ddependency-check.format=JSON
        continue-on-error: false

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check
          path: backend/target/dependency-check-report.json

      # Scan what is actually deployed. A source-tree scan cannot see patched/unpatched Alpine
      # packages and does not reliably resolve every transitive dependency inside the Boot jar.
      - name: Build production container
        run: docker build -t registerwerk-backend:ci .

      - name: Scan production container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: registerwerk-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
