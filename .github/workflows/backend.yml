name: Backend CI

on:
  push:
    branches: [main, feat/**, fix/**, release/**, develop, review/**]
    paths: [backend/**, scripts/docker-build-retry.sh, scripts/docker-hub-mirror.sh, .github/workflows/backend.yml, .github/actions/trivy-image-scan/**]
  pull_request:
    branches: [main, develop]
    paths: [backend/**, scripts/docker-build-retry.sh, scripts/docker-hub-mirror.sh, .github/workflows/backend.yml, .github/actions/trivy-image-scan/**]

# Read-only by default; the jobs that upload SARIF to code scanning ask for `security-events: write` themselves.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # catches an unguarded destructive DDL statement (DROP TABLE/COLUMN, TRUNCATE) in a
  # NEW migration before it merges — see scripts/check-destructive-migrations.sh's own header for
  # the acknowledgment mechanism. Independent of build-test so it still runs (and still blocks
  # the PR) even if a migration change happens to also break compilation elsewhere.
  migration-safety:
    name: Destructive Migration Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs against origin/main to find newly-added migration files — a shallow
          # (default) checkout has no history to diff against.
          fetch-depth: 0
      - run: scripts/check-destructive-migrations.sh "origin/${{ github.event.repository.default_branch }}"

  build-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Service containers are pulled before any step runs, so the daemon mirror below cannot help;
        # the image is addressed through Google's Docker Hub cache (Docker Hub rate-limits shared runners).
        image: mirror.gcr.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: registerwerk_test
          POSTGRES_USER: registerwerk
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U registerwerk"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build and verify (tests + JaCoCo)
        run: ./mvnw verify -B
        env:
          # Testcontainers pulls postgres, MinIO and its Ryuk reaper from Docker Hub, whose anonymous
          # rate limit hits shared runner IPs. This prefixes every Docker Hub image it starts with
          # Google's pull-through cache (the daemon-wide registry mirror made this job slow, 65a938d8).
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          DB_URL: jdbc:postgresql://localhost:5432/registerwerk_test
          DB_USER: registerwerk
          DB_PASSWORD: testpassword
          JWT_DEV_SECRET: ci-test-jwt-secret-not-for-production-use-at-all
          REGISTERWERK_WALLET_MASTER_KEY: ci-wallet-master-key-32-chars-min

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  # Canton sources (CantonBondService, CantonLedgerClient, ...) and their CantonProfile* tests
  # are excluded from the default build and only compile under -Pcanton; without this job a
  # compile break or regression there is invisible to CI.
  canton-profile:
    name: Canton Profile Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Compile and test with -Pcanton
        run: ./mvnw test -B -Pcanton -Dtest='CantonProfile*' -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true

  # Scan what is actually deployed. A source-tree scan cannot see patched/unpatched Alpine
  # packages and does not reliably resolve every transitive dependency inside the Boot jar.
  sast:
    name: SAST & SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    permissions:
      contents: read
      security-events: write  # SARIF upload of the image scan
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Build production container
        run: ../scripts/docker-build-retry.sh -t registerwerk-backend:ci .

      - name: Scan production container
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: registerwerk-backend:ci
          sarif: trivy-backend.sarif

  # A second, independent dependency scanner (NVD/CPE matching). It has its own job so that it cannot hold up,
  # or be cancelled by the time limit of, the image scan above.
  #
  # The NVD data comes from the Dependency-Check project's own mirror of the NVD (a data feed rebuilt about
  # every hour by github.com/dependency-check/DependencyCheck_Builder and served from GitHub Pages: ~200 MB in
  # all, a cold run needs minutes), NOT from the NVD REST API. That API delivered ~2,000 records a minute in
  # October 2026 and a cold run needs 410,000: it timed out after 120 minutes with half of them, and the
  # plugin's maintainers say the slowness is upstream and not fixable on our side. The feed is data NIST
  # published; the same project ships the plugin this job already executes.
  #
  # The database is cached per ISO week so a run only fetches what changed since. GitHub scopes caches to a
  # branch (and the default branch), so the first run on a new branch starts cold; that is cheap now.
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build-test
    defaults:
      run:
        working-directory: backend
    env:
      # Pinned so the gate does not change underneath the build. Part of the cache key: a new plugin version
      # may change the database schema.
      ODC_VERSION: "13.0.0"
      NVD_DATA_DIR: ${{ github.workspace }}/.dependency-check-data
      # {0} is replaced by a year or "modified". The directory also serves cache.properties and *.meta.
      NVD_FEED_URL: https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Week of the database cache
        id: week
        run: echo "iso=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # An older database of the same plugin version is fine: the run below only updates it.
      - name: Restore the NVD database
        id: nvd-cache
        uses: actions/cache/restore@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-v${{ env.ODC_VERSION }}-${{ steps.week.outputs.iso }}
          restore-keys: dependency-check-nvd-v${{ env.ODC_VERSION }}-

      # A mirror that stopped updating would silently weaken the gate: the scan would pass against old data.
      # Warn after three days, fail after seven (the plugin itself treats a database older than a week as
      # due for a full refresh). The retries absorb a transient GitHub Pages error.
      - name: Check that the NVD mirror is current
        working-directory: .
        run: |
          props=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 "${NVD_FEED_URL%/*}/cache.properties")
          stamp=$(printf '%s\n' "$props" | sed -n 's/^lastModifiedDate=//p')
          stamp=${stamp//\\/}   # the properties file escapes the colons as \:
          [ -n "$stamp" ] || { echo "::error::cache.properties of the NVD mirror has no lastModifiedDate"; exit 1; }
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$stamp" +%s) ) / 86400 ))
          echo "NVD mirror last updated $stamp (${age_days} day(s) ago)"
          if [ "$age_days" -gt 7 ]; then
            echo "::error::The NVD mirror is $age_days days old; a scan against it would be misleading"; exit 1
          elif [ "$age_days" -gt 3 ]; then
            echo "::warning::The NVD mirror is $age_days days old"
          fi

      # The plugin reads the Maven user properties `failBuildOnCVSS` and `format` (the `dependency-check.`-
      # prefixed spellings are ignored, so they would run with the defaults: never fail, HTML report).
      # No NVD API key is needed (or passed) in feed mode. A run that ends before a report exists (the mirror
      # was unreachable) is retried; one that wrote a report and still failed is the gate speaking, and
      # is not retried.
      - name: OWASP Dependency-Check
        id: owasp
        timeout-minutes: 30
        run: |
          for attempt in 1 2 3; do
            rm -f target/dependency-check-report.json
            if ./mvnw "org.owasp:dependency-check-maven:${ODC_VERSION}:check" -B \
                 -DnvdDatafeedUrl="$NVD_FEED_URL" \
                 -DconnectionTimeout=30000 -DreadTimeout=180000 \
                 -DdataDirectory="$NVD_DATA_DIR" \
                 -DsuppressionFiles=dependency-check-suppressions.xml \
                 -DfailBuildOnCVSS=7 \
                 -Dformat=JSON; then
              exit 0
            fi
            if [ -f target/dependency-check-report.json ]; then
              echo "::error::Dependency-Check reported findings at or above the CVSS threshold"; exit 1
            fi
            echo "::warning::Attempt $attempt ended before a report was written (feed unreachable?)"
            sleep $((attempt * 30))
          done
          echo "::error::Dependency-Check could not complete after 3 attempts"; exit 1

      # Only a database that was brought up to date is worth keeping, so save when the analysis got as far as
      # writing its report (also after a failed gate), never after a timeout or a failed download: a partly
      # filled database restored by the next run would just be a slower start. An exact key hit is not saved
      # again; it is refreshed by the next run's update.
      - name: Save the NVD database
        if: ${{ always() && steps.nvd-cache.outputs.cache-hit != 'true' && hashFiles('backend/target/dependency-check-report.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-v${{ env.ODC_VERSION }}-${{ steps.week.outputs.iso }}

      - name: Upload OWASP report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-dependency-check
          path: backend/target/dependency-check-report.json

  # github/codeql-action was previously used ONLY as a SARIF uploader for Trivy's
  # container-image scan results above — actual CodeQL static analysis (source-level dataflow,
  # SQL-injection/deserialization/auth-bypass-class findings Trivy's dependency/image scanning
  # can't see) never ran anywhere in this repo. This job is the real thing.
  codeql-java:
    name: CodeQL (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      # CodeQL's Java extractor needs compiled bytecode, not just source — tests skipped here
      # since build-test above already runs the full suite; this job only needs `compile` to
      # succeed so CodeQL has classes to analyze.
      - name: Build for CodeQL
        run: ./mvnw compile -B -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
