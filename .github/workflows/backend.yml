name: Backend CI

on:
  push:
    branches: [main, feat/**, fix/**, release/**, develop, review/**]
    paths: [backend/**, scripts/docker-build-retry.sh, scripts/docker-hub-mirror.sh, .github/workflows/backend.yml]
  pull_request:
    branches: [main, develop]
    paths: [backend/**, scripts/docker-build-retry.sh, scripts/docker-hub-mirror.sh, .github/workflows/backend.yml]

permissions:
  contents: read
  security-events: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # catches an unguarded destructive DDL statement (DROP TABLE/COLUMN, TRUNCATE) in a
  # NEW migration before it merges — see scripts/check-destructive-migrations.sh's own header for
  # the acknowledgment mechanism. Independent of build-test so it still runs (and still blocks
  # the PR) even if a migration change happens to also break compilation elsewhere.
  migration-safety:
    name: Destructive Migration Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs against origin/main to find newly-added migration files — a shallow
          # (default) checkout has no history to diff against.
          fetch-depth: 0
      - run: scripts/check-destructive-migrations.sh "origin/${{ github.event.repository.default_branch }}"

  build-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Service containers are pulled before any step runs, so the daemon mirror below cannot help;
        # the image is addressed through Google's Docker Hub cache (Docker Hub rate-limits shared runners).
        image: mirror.gcr.io/library/postgres:18.6-alpine
        env:
          POSTGRES_DB: registerwerk_test
          POSTGRES_USER: registerwerk
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U registerwerk"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Testcontainers pulls postgres/ryuk through the daemon.
      - name: Pull Docker Hub images through a mirror
        working-directory: .
        run: scripts/docker-hub-mirror.sh

      - name: Build and verify (tests + JaCoCo)
        run: ./mvnw verify -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/registerwerk_test
          DB_USER: registerwerk
          DB_PASSWORD: testpassword
          JWT_DEV_SECRET: ci-test-jwt-secret-not-for-production-use-at-all
          REGISTERWERK_WALLET_MASTER_KEY: ci-wallet-master-key-32-chars-min

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  # Canton sources (CantonBondService, CantonLedgerClient, ...) and their CantonProfile* tests
  # are excluded from the default build and only compile under -Pcanton; without this job a
  # compile break or regression there is invisible to CI.
  canton-profile:
    name: Canton Profile Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Compile and test with -Pcanton
        run: ./mvnw test -B -Pcanton -Dtest='CantonProfile*' -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true

  # Scan what is actually deployed. A source-tree scan cannot see patched/unpatched Alpine
  # packages and does not reliably resolve every transitive dependency inside the Boot jar.
  sast:
    name: SAST & SCA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Build production container
        run: ../scripts/docker-build-retry.sh -t registerwerk-backend:ci .

      - name: Scan production container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: registerwerk-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "1"

      # The scan action runs in the workspace root, not in this job's default working directory.
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-backend.sarif') != ''
        with:
          sarif_file: trivy-backend.sarif

  # A second, independent dependency scanner (NVD/CPE matching). It has its own job because its first
  # run downloads the whole NVD (~400k records, ~50 minutes even with an API key) and must not hold up,
  # or be cancelled by the time limit of, the image scan above. The database is cached between runs, so
  # later runs only fetch what changed.
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: build-test
    defaults:
      run:
        working-directory: backend
    env:
      NVD_DATA_DIR: ${{ github.workspace }}/.dependency-check-data
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # Newest database first; every run saves a fresh entry under its own key (old ones are evicted).
      - name: Restore the NVD database
        id: nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ github.run_id }}
          restore-keys: dependency-check-nvd-

      # NVD rejects requests without an API key (repository secret NVD_API_KEY). The plugin reads the
      # Maven user properties `failBuildOnCVSS` and `format`; the `dependency-check.`-prefixed spellings
      # this step used before are ignored, so it ran with the defaults (never fail, HTML report).
      # The plugin version is pinned so the gate does not change underneath the build.
      - name: OWASP Dependency-Check
        id: owasp
        timeout-minutes: 120
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw org.owasp:dependency-check-maven:13.0.0:check -B
             -DnvdApiKey="$NVD_API_KEY"
             -DdataDirectory="$NVD_DATA_DIR"
             -DsuppressionFiles=dependency-check-suppressions.xml
             -DfailBuildOnCVSS=7
             -Dformat=JSON

      # Also after a failed gate (the database is complete by then); not after a cancellation.
      - name: Save the NVD database
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .dependency-check-data
          key: dependency-check-nvd-${{ github.run_id }}

      - name: Upload OWASP report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-dependency-check
          path: backend/target/dependency-check-report.json

  # github/codeql-action was previously used ONLY as a SARIF uploader for Trivy's
  # container-image scan results above — actual CodeQL static analysis (source-level dataflow,
  # SQL-injection/deserialization/auth-bypass-class findings Trivy's dependency/image scanning
  # can't see) never ran anywhere in this repo. This job is the real thing.
  codeql-java:
    name: CodeQL (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      # CodeQL's Java extractor needs compiled bytecode, not just source — tests skipped here
      # since build-test above already runs the full suite; this job only needs `compile` to
      # succeed so CodeQL has classes to analyze.
      - name: Build for CodeQL
        run: ./mvnw compile -B -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
