name: Frontend CI

on:
  push:
    branches: [main, feat/**, fix/**]
    paths:
      - frontend-operator/**
      - frontend-customer/**
      - frontend-shared/**
      - .github/workflows/frontend.yml
  pull_request:
    branches: [main]
    paths:
      - frontend-operator/**
      - frontend-customer/**
      - frontend-shared/**

permissions:
  contents: read
  security-events: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared UI library has no angular.json/project of its own — both apps consume it via a
  # TS path alias (@registerwerk/ui), so it was previously outside both apps' `ng lint` scope
  # entirely and had no lint coverage. Its own eslint.config.js (frontend-shared/eslint.config.js)
  # reuses frontend-operator's node_modules via the existing symlink rather than duplicating the
  # dependency install.
  frontend-shared:
    name: Shared UI Library
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-operator/package-lock.json
      - run: npm ci
        working-directory: frontend-operator
      - run: ./node_modules/.bin/eslint projects/ui/src
        working-directory: frontend-shared

  frontend-operator:
    name: Operator Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-operator/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test -- --watch=false --browsers=ChromeHeadlessCI
      - run: npm run build -- --configuration production
      - name: Build production container
        run: docker build -f frontend-operator/Dockerfile -t registerwerk-operator:ci .
        working-directory: .
      - name: Scan production container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: registerwerk-operator:ci
          format: sarif
          output: trivy-op.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-op.sarif

  frontend-customer:
    name: Customer Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-customer/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test -- --watch=false --browsers=ChromeHeadlessCI
      - run: npm run build -- --configuration production
      - name: Build production container
        run: docker build -f frontend-customer/Dockerfile -t registerwerk-customer:ci .
        working-directory: .
      - name: Scan production container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: registerwerk-customer:ci
          format: sarif
          output: trivy-cust.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-cust.sarif
