name: Frontend CI

on:
  push:
    branches: [main, feat/**, fix/**, develop, review/**]
    paths:
      - frontend-operator/**
      - frontend-customer/**
      - frontend-shared/**
      - scripts/docker-build-retry.sh
      - scripts/docker-hub-mirror.sh
      - .github/workflows/frontend.yml
      - .github/actions/trivy-image-scan/**
  pull_request:
    branches: [main, develop]
    paths:
      - frontend-operator/**
      - frontend-customer/**
      - frontend-shared/**
      - scripts/docker-build-retry.sh
      - scripts/docker-hub-mirror.sh
      - .github/workflows/frontend.yml
      - .github/actions/trivy-image-scan/**

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared UI library has no angular.json/project of its own — both apps consume it via a
  # TS path alias (@registerwerk/ui), so it was previously outside both apps' `ng lint` scope
  # entirely and had no lint coverage. Its own eslint.config.js (frontend-shared/eslint.config.js)
  # reuses frontend-operator's node_modules via the existing symlink rather than duplicating the
  # dependency install.
  frontend-shared:
    name: Shared UI Library
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend-operator/package-lock.json
      - run: npm ci
        working-directory: frontend-operator
      # frontend-shared/node_modules is an untracked symlink; point it at the operator app's install
      # (frontend-shared/link-node-modules.mjs), as the app scripts and the Dockerfiles do.
      - run: node ../frontend-shared/link-node-modules.mjs
        working-directory: frontend-operator
      - run: ./node_modules/.bin/eslint projects/ui/src
        working-directory: frontend-shared

  frontend-operator:
    name: Operator Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # SARIF upload of the image scan
    defaults:
      run:
        working-directory: frontend-operator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend-operator/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test -- --watch=false
      - run: npm run build -- --configuration production
      - name: Build production container
        run: scripts/docker-build-retry.sh -f frontend-operator/Dockerfile -t registerwerk-operator:ci .
        working-directory: .
      - name: Scan production container
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: registerwerk-operator:ci
          sarif: trivy-op.sarif

  frontend-customer:
    name: Customer Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # SARIF upload of the image scan
    defaults:
      run:
        working-directory: frontend-customer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend-customer/package-lock.json
      - run: npm ci
      # npm run lint/test/build re-point frontend-shared/node_modules at this app's copy first
      # (frontend-shared/link-node-modules.mjs), exactly as frontend-customer/Dockerfile does.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test -- --watch=false
      - run: npm run build -- --configuration production
      - name: Build production container
        run: scripts/docker-build-retry.sh -f frontend-customer/Dockerfile -t registerwerk-customer:ci .
        working-directory: .
      - name: Scan production container
        uses: ./.github/actions/trivy-image-scan
        with:
          image-ref: registerwerk-customer:ci
          sarif: trivy-cust.sarif

  # github/codeql-action was previously used ONLY as a SARIF uploader for each app's
  # Trivy container-image scan above — actual CodeQL static analysis of the TypeScript/Angular
  # source itself (XSS sinks, unsafe DOM APIs, prototype pollution) never ran. JS/TS analysis is
  # source-based (no build/npm-install step needed), so one job covers all three source trees.
  codeql-typescript:
    name: CodeQL (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          source-root: .

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
