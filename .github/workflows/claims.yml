name: Claims governance

on:
  push:
    branches: [main, feat/**, fix/**, release/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: claims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-registry:
    name: Validate registry and scan claims
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/verify-claims.test.mjs
      - run: node scripts/verify-claims.mjs
      - name: Enforce append-only claim history against pull-request base
        if: github.event_name == 'pull_request'
        run: node scripts/verify-claims.mjs --base-ref "${{ github.event.pull_request.base.sha }}"
      - name: Enforce append-only claim history against push base
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/verify-claims.mjs --base-ref "${{ github.event.before }}"

  contract-evidence:
    name: Verify ERC-3525 claim evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: node scripts/run-claim-evidence.mjs contract-erc3525

  backend-evidence:
    name: Verify reporting-quarantine evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - run: node scripts/run-claim-evidence.mjs backend-regreporting

  indexer-evidence:
    name: Verify EVM subgraph gate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: indexer/evm/subgraph/package-lock.json
      # validate-abi-parity.mjs diffs the checked-in subgraph ABIs against the canonical
      # Forge artifacts under contracts/out, so the contracts must be built first.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: forge build
        working-directory: contracts
      - run: npm ci
        working-directory: indexer/evm/subgraph
      - run: node scripts/run-claim-evidence.mjs indexer-subgraph
