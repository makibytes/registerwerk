name: Documentation

on:
  push:
    branches: [main, develop, feat/**, fix/**, release/**]
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'scripts/verify-docs-language-switcher.mjs'
      - 'scripts/docker-build-retry.sh'
      - 'scripts/docker-hub-mirror.sh'
      - 'docker-compose.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'scripts/verify-docs-language-switcher.mjs'
      - 'scripts/docker-build-retry.sh'
      - 'scripts/docker-hub-mirror.sh'
      - 'docker-compose.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Strict MkDocs build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs test dependencies
        working-directory: docs
        run: npm ci

      - name: Verify runtime language-link origin handling
        run: node scripts/verify-docs-language-switcher.mjs

      - name: Unit-test the browser-check helpers
        working-directory: docs
        run: npm run test:unit

      # The compose `docs` profile ships an image built from docs/Dockerfile, not the bare
      # upstream squidfunk/mkdocs-material image — this site requires mkdocs-static-i18n
      # (mkdocs.yml's plugins list), which the bare image doesn't have. Build the real image
      # first, then run the strict build inside it. Building the image also verifies the
      # Dockerfile itself stays buildable, so this replaces what used to be a separate step.
      #
      # Using the bare image here (as this step previously did, and as the docs in CLAUDE.md
      # still describe) fails outright with "Config value 'plugins': The 'i18n' plugin is not
      # installed" — this was never actually green in CI once i18n was added; --strict was
      # promoting a config error to a build failure that nothing caught.
      - name: Build the docs container image
        # GitHub's repository-scoped token cannot read the private Chaincache sibling. The
        # explicit build arg keeps the fifth path testable with marked placeholders; normal
        # builds still require the pinned submodule and render its canonical Markdown.
        run: >-
          scripts/docker-build-retry.sh
          --build-arg ALLOW_MISSING_CHAINCACHE_DOCS=1
          -f docs/Dockerfile
          -t registerwerk-docs:ci
          .

      # The order of the next four steps matters. Starting a container makes Docker create a veth interface,
      # bring `docker0` up and assign addresses over the following seconds, and Chromium aborts every request
      # that is in flight when the host's network changes (`net::ERR_NETWORK_CHANGED`). When the container
      # start and the browser launch were two seconds apart in one step, the first page loads landed in that
      # window and about one run in ten failed. So: start the container, let the browser download fill ~20 s
      # of otherwise idle network time, and only then launch the browser. verify-browser.mjs additionally runs
      # the whole check again if a network change still hits it (docs/platform/continuous-integration.md).
      - name: Start the docs container
        run: |
          docker run --rm -d --name registerwerk-docs-ci -p 48003:80 registerwerk-docs:ci
          healthy=
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:48003/healthz; then healthy=1; break; fi
            sleep 1
          done
          if [ -z "$healthy" ]; then
            echo "::error::the docs container did not become healthy within 30 s"
            docker logs registerwerk-docs-ci
            exit 1
          fi

      - name: Install the browser
        run: npx --prefix docs playwright install --with-deps chromium

      - name: Verify docs runtime behavior
        run: npm --prefix docs run test:browser

      - name: Stop the docs container
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then docker logs registerwerk-docs-ci || true; fi
          docker stop registerwerk-docs-ci || true

      # docs/Dockerfile runs `mkdocs build --strict` in its build stage. The resulting image is
      # deliberately a static nginx image, so running `build --strict` *after* this step would
      # try to execute a command named "build" in nginx and fail with exit 127.
