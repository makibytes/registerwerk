name: Secret Scanning

# Unlike the other CI workflows, this runs on every push/PR with no path filter — a leaked
# secret can land in any file (a stray .env, a hardcoded key in a demo seed, a copy-pasted
# curl command in a doc), so scoping this to specific directories would defeat the point.
# This was the one real gap in an otherwise strong supply-chain security setup (SBOM + Cosign
# signing + Trivy + Slither + OWASP Dependency-Check already exist) — notable here specifically
# because this codebase handles key material and now rejects plaintext key env vars at startup.

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
