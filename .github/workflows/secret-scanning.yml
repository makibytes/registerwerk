name: Secret Scanning

# Unlike the other CI workflows, this runs on every push/PR with no path filter — a leaked
# secret can land in any file (a stray .env, a hardcoded key in a demo seed, a copy-pasted
# curl command in a doc), so scoping this to specific directories would defeat the point.
# This was the one real gap in an otherwise strong supply-chain security setup (SBOM + Cosign
# signing + Trivy + Slither + OWASP Dependency-Check already exist) — notable here specifically
# because this codebase handles key material and now rejects plaintext key env vars at startup.

on:
  push:
    branches: [main, feat/**, fix/**, develop, review/**]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks CLI is MIT-licensed and free; gitleaks/gitleaks-action@v2 is not — it
      # refuses to run for a GitHub organisation without a paid GITLEAKS_LICENSE secret
      # ("[makibytes] is an organization. License key is required."). So the pinned release
      # binary is run directly, checksum-verified like the other pinned tools in this repo.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz

      # Scans the full history reachable from the checked-out commit; reviewed false positives
      # are fingerprinted in .gitleaksignore (picked up from the repository root). --redact keeps
      # a real finding from being printed into the public job log.
      - name: Scan repository history
        run: gitleaks git --no-banner --redact --verbose .
