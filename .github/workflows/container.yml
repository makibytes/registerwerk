name: Container Build & Sign

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write  # for Cosign OIDC keyless signing

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Backend Container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build locally (no push yet) so the Trivy gate below runs BEFORE anything reaches the
      # registry or gets a valid Cosign signature — previously the scan ran after push+sign,
      # so a HIGH/CRITICAL image could already be pullable and validly signed before the job
      # failed (Phase 12, finding #13).
      - name: Build (local, pre-scan)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate — must pass before push)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }},ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/backend@${{ steps.push.outputs.digest }}

      # Gives operators a real, reproducible tag matching a cut release (rather than only
      # :latest/:<sha>) — points at the exact same manifest digest already pushed above,
      # no rebuild (Phase 12, finding #3: Chart.yaml's appVersion had no corresponding
      # published image at all).
      - name: Tag release version
        if: github.event_name == 'release'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}/backend:${{ github.event.release.tag_name }} \
            ghcr.io/${{ github.repository }}/backend@${{ steps.push.outputs.digest }}

  release-sbom:
    name: Attach SBOM + Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'release'
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: registerwerk-sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: registerwerk-sbom.spdx.json
