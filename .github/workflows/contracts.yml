name: Contracts CI

on:
  push:
    branches: [main, feat/**, fix/**, develop, review/**]
    paths: [contracts/**, .github/workflows/contracts.yml]
  pull_request:
    branches: [main, develop]
    paths: [contracts/**, .github/workflows/contracts.yml]

permissions:
  contents: read
  security-events: write

concurrency:
  group: contracts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry-test:
    name: Foundry Tests & Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/contract-libs

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      # No `forge install` here: with no arguments it checks out every submodule in the repository,
      # including the private docs/_chaincache, and fails. The contract-libs action above already
      # initialised contracts/lib.
      - name: Run tests
        run: forge test -vvv
        working-directory: contracts

      - name: Enforce formatting
        run: >-
          forge fmt --check
          src/factory/AssetTokenFactory.sol
          src/factory/AssetTokenDeployers.sol
          src/factory/AssetTokenFactoryBootstrap.sol
          src/ecosystem/RegisterwerkDeploymentRegistry.sol
          src/ecosystem/EwpgPasskeyAccount.sol
          script/DeployLocalLendingDemo.s.sol
          script/DeployLocalTrexDemo.s.sol
        working-directory: contracts

      # Forge's own `--sizes` margins still measure against EIP-170/EIP-3860, so the wrapper checks the
      # EIP-7954 limits (64 KiB runtime / 128 KiB initcode) itself and prints deploy gas. It supports a
      # shrink-only exemption list for owned debt; that list is empty (see the script header).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Test the contract-size checker
        run: node scripts/check-contract-sizes.test.mjs
      - name: Enforce deployable contract sizes
        run: node scripts/check-contract-sizes.mjs

      # `forge coverage` compiles unoptimised and instruments the code, which breaks the build on
      # "stack too deep" unless `--ir-minimum` is passed (Foundry's own remedy). That build changes gas
      # and call behaviour, so 11 tests that pass under `forge test` above fail only here: the
      # ERC-4337 paymaster validation-gas tests (AA33), two NAV-oracle `expectRevert` call-order tests
      # and one timestamp-stub test. They are excluded from this run only, by exact name (forge matches
      # filters against the full signature, hence the trailing `\(`); every other test still has to pass
      # for the report to be produced.
      #
      # The report is compiled for Osaka, not Amsterdam: `forge coverage --ir-minimum` (Foundry 1.8.5)
      # does not carry `experimental = true` into its own solc settings, so with `evm_version =
      # "amsterdam"` it dies with "EVM version 'amsterdam' is experimental and can only be used with
      # the 'settings.experimental' option enabled". Coverage only needs line hits; the Amsterdam
      # gas schedule is exercised by `forge test` above.
      - name: Coverage report
        env:
          FOUNDRY_EVM_VERSION: osaka
          FOUNDRY_EXPERIMENTAL: "false"
        run: >-
          forge coverage --ir-minimum --report lcov --report-file lcov.info
          --no-match-test '^(test_bundle_cannotOverspendPolicy|test_constructor_deploysWhenMinedAfterTheScriptTimestamp|test_expiredVoucher_rejected|test_honestOp_bookedChargeCoversRealDepositDelta|test_orgCap_isSharedAcrossWalletsOfOneOrg|test_org_withoutValidKycClaim_isNotSponsored|test_pushPrice_oldMarksAreForgottenOnlyAfterMoreThanOneWindow|test_pushPrice_skippedWindowDoesNotResetTheBand|test_voucherForAnotherSender_failsSignature|test_voucherFromWrongSigner_failsSignature|test_voucherGasFieldsAreSigned)\('
        working-directory: contracts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: contracts/lcov.info
          flags: solidity

  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/contract-libs

      # crytic/slither-action@v0.4.0 builds with its own, older Foundry, which cannot resolve this
      # repository's `pragma solidity ^0.8.36` ("No solc version exists that matches the version
      # requirement"). Slither is run directly instead, on the same pinned Foundry the test job uses
      # (Slither shells out to `forge build` for Foundry projects).
      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Slither
        run: python -m pip install slither-analyzer==0.11.6

      # Medium findings are retained in the SARIF for triage; high-severity findings fail the
      # build. Vendored libraries (lib/) are not this repository's code: unfiltered, ~90% of the
      # findings, and several of the Highs, come from OpenZeppelin and ERC-3643 sources.
      - name: Run Slither
        working-directory: contracts
        run: >-
          slither .
          --exclude-informational
          --filter-paths "lib/"
          --fail-high
          --sarif "$GITHUB_WORKSPACE/slither.sarif"

      - name: Upload Slither SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('slither.sarif') != ''
        with:
          sarif_file: slither.sarif
