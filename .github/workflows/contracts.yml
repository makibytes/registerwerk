name: Contracts CI

on:
  push:
    branches: [main, feat/**, fix/**]
    paths: [contracts/**, .github/workflows/contracts.yml]
  pull_request:
    branches: [main]
    paths: [contracts/**, .github/workflows/contracts.yml]

jobs:
  foundry-test:
    name: Foundry Tests & Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install
        working-directory: contracts

      - name: Run tests
        run: forge test -vvv
        working-directory: contracts

      - name: Coverage report
        run: forge coverage --report lcov --report-file lcov.info
        working-directory: contracts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/lcov.info
          flags: solidity

  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          slither-args: "--exclude-informational --sarif slither.sarif"

      - name: Upload Slither SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: slither.sarif
