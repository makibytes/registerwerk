name: Contracts CI

on:
  push:
    branches: [main, feat/**, fix/**]
    paths: [contracts/**, .github/workflows/contracts.yml]
  pull_request:
    branches: [main]
    paths: [contracts/**, .github/workflows/contracts.yml]

concurrency:
  group: contracts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry-test:
    name: Foundry Tests & Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install
        working-directory: contracts

      - name: Run tests
        run: forge test -vvv
        working-directory: contracts

      - name: Enforce formatting
        run: >-
          forge fmt --check
          src/factory/AssetTokenFactory.sol
          src/factory/AssetTokenDeployers.sol
          src/factory/AssetTokenFactoryBootstrap.sol
          src/ecosystem/RegisterwerkDeploymentRegistry.sol
          src/ecosystem/EwpgPasskeyAccount.sol
          script/DeployLocalLendingDemo.s.sol
          script/DeployLocalTrexDemo.s.sol
        working-directory: contracts

      - name: Enforce deployable contract sizes
        run: forge build --sizes
        working-directory: contracts

      - name: Coverage report
        run: forge coverage --report lcov --report-file lcov.info
        working-directory: contracts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/lcov.info
          flags: solidity

  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          # Keep the existing repository-wide baseline enforceable. Medium findings are
          # retained in SARIF for triage; high-severity findings fail the build.
          fail-on: high
          slither-args: "--exclude-informational --sarif slither.sarif"

      - name: Upload Slither SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: slither.sarif
