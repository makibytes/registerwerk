site_name: Registerwerk
site_url: !ENV [DOCS_SITE_URL, "http://localhost:8003/"]
site_description: >-
  How a tokenised security is issued, held, traded, financed and redeemed —
  and how Registerwerk implements each step. Written for customers, operators,
  compliance teams and engineers.

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Manrope
    code: IBM Plex Mono
  features:
    # navigation.instant is deliberately NOT enabled: mkdocs-static-i18n cannot make the
    # language switcher contextual alongside it, so switching language would drop you on
    # the other language's home page instead of the page you were reading. Staying put
    # is worth more than the instant-loading nicety.
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips

extra_css:
  - assets/brand.css
  - assets/i18n.css

# mkdocs-static-i18n emits root-relative language links. Explicitly bind them to the browser's
# current origin at runtime so a docs instance reached on a non-default port (for example
# http://nibbler:8003) keeps that port when changing language.
extra_javascript:
  - assets/language-switcher-origin.js

plugins:
  # Order matters: i18n must come first so that it can reconfigure the theme and hand
  # the per-language page sets to search.
  - i18n:
      docs_structure: suffix          # customer/intro.md + customer/intro.de.md
      fallback_to_default: true       # untranslated page → English, never a 404
      reconfigure_material: true      # contextual language switcher, per-language search
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Registerwerk

