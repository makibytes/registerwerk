# docs/ also holds a dormant Docusaurus setup (docusaurus.config.ts, sidebars-*.ts,
# src/, static/, node_modules/). MkDocs Material is the documentation server that
# docker-compose actually runs, so everything below is excluded from the build —
# without this, every npm package README in node_modules ships as a doc page.
exclude_docs: |
  hooks.py
  includes/
  Dockerfile
  translate.py
  TRANSLATION-TERMINOLOGY.md
  node_modules/
  build/
  src/
  static/
  *.ts
  *.json
  package-lock.json

not_in_nav: |
  claims/README.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde
  # Every page gets the abbreviation list appended, so any defined term anywhere in
  # the documentation shows its definition on hover without the author linking it.
  - pymdownx.snippets:
      base_path:
        - docs
      auto_append:
        - includes/glossary.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      title: On this page

