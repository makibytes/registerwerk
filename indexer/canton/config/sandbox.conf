// Overrides of Canton's built-in `sandbox` setup (one participant `sandbox`, one synchronizer).
// The ports come from the command line (see docker-entrypoint.sh); here every API is bound to 0.0.0.0 so the
// published container ports are reachable from the host. In-memory storage: all state is lost when the
// container stops.
canton.participants.sandbox {
  ledger-api.address = "0.0.0.0"
  admin-api.address = "0.0.0.0"
  http-ledger-api.address = "0.0.0.0"
}
