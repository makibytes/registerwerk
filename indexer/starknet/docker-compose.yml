services:
  # Starknet devnet — local development / smoke-testing node with JSON-RPC on port 5050.
  #
  # Production operators point the STARKNET_MAINNET / STARKNET_SEPOLIA chain_config rows (see
  # Operator Portal → Network Nodes) at a real Starknet RPC provider — this sidecar is not a
  # substitute for that; it exists so Cairo token deployment and the Starknet transfer indexer
  # (backend StarknetTransferSyncService) can be exercised end-to-end without any external
  # dependency.
  starknet-devnet:
    image: shardlabs/starknet-devnet-rs:${STARKNET_DEVNET_TAG:-0.9.1}
    command: >
      --seed ${STARKNET_DEVNET_SEED:-0}
      --accounts ${STARKNET_DEVNET_ACCOUNTS:-10}
      --host 0.0.0.0
      --port 5050
    ports:
      - "5050:5050"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5050/is_alive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
