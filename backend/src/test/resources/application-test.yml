spring:
  main:
    allow-bean-definition-overriding: true

  datasource:
    # overridden at runtime by @DynamicPropertySource in integration tests
    url: jdbc:postgresql://localhost:5432/registerwerk_test
    username: registerwerk
    password: changeme

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

  mail:
    host: localhost
    port: 3025

registerwerk:
  screening:
    open-sanctions:
      # Keep the production adapter bean (and therefore fail-closed gate semantics) active, but
      # never let integration tests contact a public compliance provider. Connection refusal on
      # loopback is immediate and is recorded as the expected ERROR screening result.
      base-url: http://127.0.0.1:1
  auth:
    dev-secret: "registerwerk-test-jwt-secret-not-for-production!!"
    step-up:
      # Tests use step-up endpoints without TOTP enrolment; production default is false.
      allow-unenrolled: true
  chains:
    ethereum:
      testnet:
        # overridden at runtime by @DynamicPropertySource to point at anvil
        rpc-url: http://localhost:8545
        chain-id: 31337
  wallet:
    master-key: "registerwerk-test-master-key-at-least-32-chars!!"
    storage-dir: "/tmp/registerwerk-test-wallets"
  documents:
    max-inline-bytes: 5242880
    s3:
      bucket: test-bucket
      endpoint: http://localhost:4566
      access-key: test
      secret-key: test
      region: us-east-1
  onboarding:
    token-ttl-hours: 1
    frontend-url: http://localhost:4201

logging:
  level:
    com.registerwerk: DEBUG
