<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body style="font-family: Arial, sans-serif; color: #111827;">
  <p>Hello <span th:text="${recipientName}">there</span>,</p>
  <p>
    A password reset was requested for your Registerwerk account at
    <strong th:text="${entityName}">your company</strong>.
  </p>
  <p>
    Reset your password here:
    <a th:href="${resetUrl}" th:text="${resetUrl}">reset link</a>
  </p>
  <p>If you did not request this, you can ignore this email.</p>
</body>
</html>
