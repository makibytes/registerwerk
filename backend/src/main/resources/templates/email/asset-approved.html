<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Approved — Registerwerk</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { background: #15803d; color: #ffffff; padding: 32px 40px; }
        .header h1 { margin: 0; font-size: 24px; }
        .badge { display: inline-block; background: #dcfce7; color: #15803d; font-weight: bold; padding: 6px 16px; border-radius: 20px; font-size: 14px; margin-bottom: 16px; }
        .body { padding: 32px 40px; color: #333333; line-height: 1.6; }
        .body p { margin: 0 0 16px 0; }
        .footer { background: #f4f6f8; padding: 20px 40px; color: #888; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Asset Approved</h1>
    </div>
    <div class="body">
        <span class="badge">&#10003; APPROVED</span>
        <p>Dear <strong th:text="${entityName}">Entity Name</strong>,</p>
        <p>
            Your asset <strong th:text="${assetName}">Asset Name</strong> has been approved by
            the Registerwerk operator and may now be issued and made available for subscription.
        </p>
        <p>Kind regards,<br/>The Registerwerk Team</p>
    </div>
    <div class="footer">
        This notification was sent because an asset you issue was reviewed and approved.
    </div>
</div>
</body>
</html>
