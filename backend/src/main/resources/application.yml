spring:
  application:
    name: registerwerk
  http:
    clients:
      # httpclient5 is on the classpath for webhook delivery only; keep every other auto-configured
      # RestClient/RestTemplate on the JDK client so their behaviour does not change.
      imperative:
        factory: jdk
  threads:
    virtual:
      enabled: true

  task:
    # With virtual threads on, Boot backs @Scheduled and @Async with SimpleAsyncTaskExecutor,
    # which is UNBOUNDED by default — every job gets its own thread and nothing queues. Most of
    # these jobs are blocking RPC calls against external chains, so an unbounded fan-out lets a
    # single slow endpoint pull an arbitrary number of concurrent outbound requests. The caps
    # below are deliberately generous (they only bite under pathological fan-out) but finite.
    scheduling:
      simple:
        concurrency-limit: 16
      shutdown:
        # Let in-flight scheduled persistence work finish during a graceful application stop.
        await-termination: true
        await-termination-period: 30s
    execution:
      simple:
        concurrency-limit: 64
      shutdown:
        # Modulith event listeners carry audit/compliance side effects.  Abruptly cancelling
        # them at shutdown creates avoidable replay work and can leave external calls half-done.
        await-termination: true
        await-termination-period: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/registerwerk}
    username: ${DB_USER:registerwerk}
    password: ${DB_PASSWORD:changeme}
    connection-fetch: lazy
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      # Fail fast rather than hang indefinitely if the pool is exhausted.
      connection-timeout: 30000
      # Recycle connections well under any reasonable DB-side/LB idle-connection kill timeout,
      # so the pool retires connections on its own terms instead of handing out ones the
      # network has silently already dropped.
      max-lifetime: 1800000
      # Bound how long a connection-liveness check itself may take.
      validation-timeout: 5000
      # Log (not kill) a connection held for longer than this — surfaces leaked/forgotten
      # connections (e.g. a missing close() on a manual JDBC path) well before pool exhaustion.
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    placeholder-replacement: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30s

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  thymeleaf:
    # Notification services resolve templates relative to the templates root, e.g. "email/welcome".
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  lifecycle:
    # Mirrors the 30s already used for scheduled-task/async shutdown (see spring.task.* above) —
    # one consistent grace period for the whole graceful-shutdown story (server.shutdown: graceful
    # below), not two different ones.
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # Client address for the login throttle (K3, 6-10): Tomcat's RemoteIpValve replaces getRemoteAddr()
  # with the X-Forwarded-For client ONLY when the TCP peer matches registerwerk.auth.trusted-proxies.
  # A client that reaches the backend directly can therefore not pick its own throttle bucket.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${registerwerk.auth.trusted-proxies}
  compression:
    enabled: true
  error:
    include-message: never
  # Lets an in-flight request finish before the JVM stops, instead of the connector cutting it
  # off mid-response — matters for rolling Kubernetes deployments, which send SIGTERM
  # to a pod that may still be serving traffic. Bounded by spring.lifecycle's shutdown timeout
  # below so a stuck request can't block shutdown forever.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      show-details: when-authorized
      # Explicit rather than relying on Spring Boot's Kubernetes-environment auto-detection
      # (activates automatically inside any real pod via KUBERNETES_SERVICE_HOST, but silently
      # does NOT activate under Docker Compose or a local run) — the Helm chart's
      # livenessProbe/readinessProbe already point at these paths, so making the setting explicit
      # keeps every deployment path consistent instead of depending on implicit detection.
      probes:
        enabled: true
      group:
        # readinessState alone only reflects "SmartLifecycle says I'm ready" — it says nothing
        # about whether this instance can actually serve a request right now. Including db here
        # means a pod that lost its database connection stops receiving traffic instead of
        # accepting requests it cannot fulfill.
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    mail:
      enabled: false
  metrics:
    distribution:
      # RED metrics: without a histogram, http.server.requests only exposes a count +
      # sum, so p95/p99 latency cannot be computed in Prometheus at all — Grafana/alerting would
      # have throughput and error-rate but no real latency signal.
      percentiles-histogram:
        http.server.requests: true
        registerwerk.scheduled.job: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 100ms, 250ms, 500ms, 1s, 2s
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

spring.modulith:
  events:
    jdbc-schema-initialization:
      enabled: false
  republish-outstanding-events-on-restart: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}

registerwerk:
  sperrvermerk:
    # 6-25 / parked T6-11: block types (comma-separated BlockType names) that the daily job may lift
    # automatically after expires_at. Default empty = none: every expired block moves to EXPIRY_REVIEW,
    # keeps blocking, and needs a step-up + second-approver lift.
    auto-expire-types: ${SPERRVERMERK_AUTO_EXPIRE_TYPES:}
  chain:
    # P4C-2: whitelist / mint / forced transfer / forced approve destinations must be an ACTIVE,
    # KYC-approved, screened holder of the asset. Disable ONLY in a demo profile that mints to
    # arbitrary addresses before creating holders.
    destination-gate:
      enabled: ${DESTINATION_GATE_ENABLED:true}
  claims:
    # P4C-3 / parked T4-05: break-glass for issuing claims to a non-APPROVED entity. Honoured only
    # when no prod/production profile is active; never enable in production.
    allow-unapproved-in-nonprod: ${CLAIMS_ALLOW_UNAPPROVED_IN_NONPROD:false}
  cors:
    # WebConfig.addCorsMappings now sets allowCredentials(true) so the httpOnly rw_session
    # cookie (SessionCookieService) is actually sent on the operator portal's cross-origin
    # dev-mode calls (environment.ts points straight at the backend, bypassing Kong — see its
    # comment) — Spring rejects "*" combined with credentials at startup, so this can no longer
    # default to a wildcard. Matches gateway/kong.yml's cors plugin origins (the customer app's
    # path); override with a comma-separated list for any other deployment.
    #
    # Both the localhost and 127.0.0.1 spelling are listed for each port: a browser's Origin
    # header is whatever hostname the address bar actually used, and "localhost" vs "127.0.0.1"
    # are different origins to CORS even though they reach the same machine. Missing either one
    # here previously broke the whole demo stack with a bare "Invalid CORS request" 403 on login
    # for anyone who happened to open the frontend via the other spelling.
    allowed-origins: ${REGISTERWERK_CORS_ALLOWED_ORIGINS:http://localhost:44200,http://localhost:44201,http://127.0.0.1:44200,http://127.0.0.1:44201}
  chaincache:
    # HS256 signing key for the short-lived bearer token ChaincacheTokenFactory mints to
    # authenticate against a chaincache instance's read APIs (GET /api/capabilities, the durable
    # event WebSocket) — chaincache's own default is chaincache.auth.enabled: true, so without
    # this every probe 401s and every chaincache node silently demotes to DIRECT_RPC. Blank means
    # no credential is presented (fine against a chaincache instance running with
    # chaincache.auth.enabled: false). Deliberately a SEPARATE secret from JWT_DEV_SECRET — never
    # share a signing key across two products.
    jwt-secret: ${CHAINCACHE_JWT_SECRET:}
    # Stable logical consumer group across pod recreation (see
    # blockchain.internal.ChaincacheDurableStreamManager). Chaincache fences this identity with a
    # database-backed lease, so one Registerwerk replica consumes while siblings remain warm
    # standbys; using HOSTNAME here silently created a brand-new cursor after every pod rollout.
    instance-id: ${REGISTERWERK_CHAINCACHE_CONSUMER_GROUP:registerwerk}
    stream:
      # A TCP-open socket is not a usable durable stream until every subscribe response arrives;
      # likewise, an event is not safely resumable until chaincache confirms its cursor ACK.
      subscribe-response-timeout-ms: ${CHAINCACHE_SUBSCRIBE_RESPONSE_TIMEOUT_MS:10000}
      ack-response-timeout-ms: ${CHAINCACHE_ACK_RESPONSE_TIMEOUT_MS:10000}
  chains:
    ethereum:
      mainnet:
        rpc-url: ${ETH_MAINNET_RPC:https://mainnet.infura.io/v3/changeme}
        chain-id: 1
      testnet:
        rpc-url: ${ETH_SEPOLIA_RPC:https://sepolia.infura.io/v3/changeme}
        chain-id: 11155111
    polygon:
      mainnet:
        rpc-url: ${POLYGON_MAINNET_RPC:https://polygon-mainnet.infura.io/v3/changeme}
        chain-id: 137
      testnet:
        rpc-url: ${POLYGON_AMOY_RPC:https://polygon-amoy.infura.io/v3/changeme}
        chain-id: 80002
    base:
      mainnet:
        rpc-url: ${BASE_MAINNET_RPC:https://mainnet.base.org}
        chain-id: 8453
      testnet:
        rpc-url: ${BASE_SEPOLIA_RPC:https://sepolia.base.org}
        chain-id: 84532
    fhenix:
      mainnet:
        rpc-url: ${FHENIX_MAINNET_RPC:https://api.fhenix.zone:7747}
        chain-id: 21888
      testnet:
        rpc-url: ${FHENIX_HELIUM_RPC:https://api.helium.fhenix.zone:7747}
        chain-id: 8008135
    inco:
      mainnet:
        rpc-url: ${INCO_MAINNET_RPC:https://mainnet.inco.org}
        chain-id: 9090
      testnet:
        rpc-url: ${INCO_RIVEST_RPC:https://validator.rivest.inco.org}
        chain-id: 21097
    solana:
      mainnet:
        rpc-url: ${SOLANA_MAINNET_RPC:https://api.mainnet-beta.solana.com}
      testnet:
        rpc-url: ${SOLANA_DEVNET_RPC:https://api.devnet.solana.com}
      # SPL Token-2022 BOND/CONFIDENTIAL presets refuse to deploy until both are set.
      transfer-hook-program-id: ${SOLANA_TRANSFER_HOOK_PROGRAM_ID:}
      confidential-transfer-auditor-elgamal-pubkey: ${SOLANA_CONFIDENTIAL_AUDITOR_ELGAMAL_PUBKEY:}
    canton:
      mainnet:
        ledger-api-url: ${CANTON_MAINNET_LEDGER_URL:}
        synchronizer-id: ${CANTON_MAINNET_SYNCHRONIZER:global-synchronizer}
        application-id: ${CANTON_APPLICATION_ID:registerwerk}
        auth-token: ${CANTON_MAINNET_TOKEN:}
      devnet:
        ledger-api-url: ${CANTON_DEVNET_LEDGER_URL:}
        synchronizer-id: ${CANTON_DEVNET_SYNCHRONIZER:dev-synchronizer}
        application-id: ${CANTON_APPLICATION_ID:registerwerk}
        auth-token: ${CANTON_DEVNET_TOKEN:}
    arbitrum:
      mainnet:
        rpc-url: ${ARBITRUM_MAINNET_RPC:https://arbitrum.publicnode.com}
        chain-id: 42161
      testnet:
        rpc-url: ${ARBITRUM_SEPOLIA_RPC:https://sepolia-rollup.arbitrum.io/rpc}
        chain-id: 421614
    avalanche:
      mainnet:
        rpc-url: ${AVALANCHE_MAINNET_RPC:https://api.avax.network/ext/bc/C/rpc}
        chain-id: 43114
      testnet:
        rpc-url: ${AVALANCHE_FUJI_RPC:https://api.avax-test.network/ext/bc/C/rpc}
        chain-id: 43113
    optimism:
      mainnet:
        rpc-url: ${OPTIMISM_MAINNET_RPC:https://mainnet.optimism.io}
        chain-id: 10
      testnet:
        rpc-url: ${OPTIMISM_SEPOLIA_RPC:https://sepolia.optimism.io}
        chain-id: 11155420
  wallet:
    master-key: ${REGISTERWERK_WALLET_MASTER_KEY:}
    storage-dir: ${REGISTERWERK_WALLET_DIR:/data/wallets}
    storage-backend: ${REGISTERWERK_WALLET_STORAGE_BACKEND:FILESYSTEM}
    # P4C-5: soft-deleted wallets keep their encrypted key material this long before WalletPurgeJob destroys it.
    retention-days: ${REGISTERWERK_WALLET_RETENTION_DAYS:90}
    kek-provider: ${REGISTERWERK_WALLET_KEK_PROVIDER:}
    kms:
      key-id: ${REGISTERWERK_WALLET_KMS_KEY_ID:}
    hsm:
      # One PKCS#11 token/session per Registerwerk instance. The SunPKCS11 file selects the
      # actual vendor library and slot. Profiles keep vendor quirks behind an adapter.
      enabled: ${REGISTERWERK_HSM_ENABLED:false}
      profile: ${REGISTERWERK_HSM_PROFILE:SOFTHSM}
      provider-config: ${REGISTERWERK_HSM_PROVIDER_CONFIG:}
      pin: ${REGISTERWERK_HSM_PIN:}
      signature-algorithm: ${REGISTERWERK_HSM_SIGNATURE_ALGORITHM:}
  contracts:
    # EwpgRepoMarketFactory per chain: lending market registration requires factory.isMarket(market)
    repo-market-factory:
      ethereum-mainnet:  ${REPO_MARKET_FACTORY_ETH_MAINNET:}
      ethereum-testnet:  ${REPO_MARKET_FACTORY_ETH_TESTNET:}
    # AssetTokenFactory address per chain identifier (populated after `forge script Deploy`)
    asset-token-factory:
      ethereum-mainnet:  ${ASSET_TOKEN_FACTORY_ETH_MAINNET:}
      ethereum-testnet:  ${ASSET_TOKEN_FACTORY_ETH_TESTNET:}
      polygon-mainnet:   ${ASSET_TOKEN_FACTORY_POLYGON_MAINNET:}
      polygon-testnet:   ${ASSET_TOKEN_FACTORY_POLYGON_TESTNET:}
      base-mainnet:      ${ASSET_TOKEN_FACTORY_BASE_MAINNET:}
      base-testnet:      ${ASSET_TOKEN_FACTORY_BASE_TESTNET:}
      arbitrum-mainnet:  ${ASSET_TOKEN_FACTORY_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${ASSET_TOKEN_FACTORY_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${ASSET_TOKEN_FACTORY_AVALANCHE_MAINNET:}
      avalanche-testnet: ${ASSET_TOKEN_FACTORY_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${ASSET_TOKEN_FACTORY_OPTIMISM_MAINNET:}
      optimism-testnet:  ${ASSET_TOKEN_FACTORY_OPTIMISM_TESTNET:}
    # EwpgTREXFactory address per chain (T-REX suite deployments)
    trex-factory:
      ethereum-mainnet:  ${TREX_FACTORY_ETH_MAINNET:}
      ethereum-testnet:  ${TREX_FACTORY_ETH_TESTNET:}
      polygon-mainnet:   ${TREX_FACTORY_POLYGON_MAINNET:}
      polygon-testnet:   ${TREX_FACTORY_POLYGON_TESTNET:}
      base-mainnet:      ${TREX_FACTORY_BASE_MAINNET:}
      base-testnet:      ${TREX_FACTORY_BASE_TESTNET:}
      arbitrum-mainnet:  ${TREX_FACTORY_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${TREX_FACTORY_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${TREX_FACTORY_AVALANCHE_MAINNET:}
      avalanche-testnet: ${TREX_FACTORY_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${TREX_FACTORY_OPTIMISM_MAINNET:}
      optimism-testnet:  ${TREX_FACTORY_OPTIMISM_TESTNET:}
    # ONCHAINID IdFactory address per chain
    id-factory:
      ethereum-mainnet:  ${ID_FACTORY_ETH_MAINNET:}
      ethereum-testnet:  ${ID_FACTORY_ETH_TESTNET:}
      polygon-mainnet:   ${ID_FACTORY_POLYGON_MAINNET:}
      polygon-testnet:   ${ID_FACTORY_POLYGON_TESTNET:}
      base-mainnet:      ${ID_FACTORY_BASE_MAINNET:}
      base-testnet:      ${ID_FACTORY_BASE_TESTNET:}
      arbitrum-mainnet:  ${ID_FACTORY_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${ID_FACTORY_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${ID_FACTORY_AVALANCHE_MAINNET:}
      avalanche-testnet: ${ID_FACTORY_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${ID_FACTORY_OPTIMISM_MAINNET:}
      optimism-testnet:  ${ID_FACTORY_OPTIMISM_TESTNET:}
    # EwpgConfidentialFactory (Zama fhEVM) — gated to Chain.ETHEREUM/Chain.BASE
    # (AssetDeploymentService.FHEVM_CHAINS); Fhenix/Inco are separate, non-Zama FHE stacks and are
    # NOT valid confidential-deployment targets (see docs/blockchains/confidential-evm.md). These
    # available only for ethereum-*/base-* identifiers.
    confidential-factory:
      ethereum-mainnet: ${CONFIDENTIAL_FACTORY_ETH_MAINNET:}
      ethereum-testnet: ${CONFIDENTIAL_FACTORY_ETH_TESTNET:}
      base-mainnet:     ${CONFIDENTIAL_FACTORY_BASE_MAINNET:}
      base-testnet:     ${CONFIDENTIAL_FACTORY_BASE_TESTNET:}
    # Shared T-REX IdentityRegistry used by CONF_ERC3643 deployments on this chain — required;
    # deployment fails loudly if unset for the target chain (see ConfidentialErc3643Service).
    confidential-identity-registry:
      ethereum-mainnet: ${CONFIDENTIAL_IDENTITY_REGISTRY_ETH_MAINNET:}
      ethereum-testnet: ${CONFIDENTIAL_IDENTITY_REGISTRY_ETH_TESTNET:}
      base-mainnet:     ${CONFIDENTIAL_IDENTITY_REGISTRY_BASE_MAINNET:}
      base-testnet:     ${CONFIDENTIAL_IDENTITY_REGISTRY_BASE_TESTNET:}
    # Optional confidential compliance module for CONF_ERC3643 — zero address (no extra
    # transfer-rule module) if unset.
    confidential-compliance:
      ethereum-mainnet: ${CONFIDENTIAL_COMPLIANCE_ETH_MAINNET:}
      ethereum-testnet: ${CONFIDENTIAL_COMPLIANCE_ETH_TESTNET:}
      base-mainnet:     ${CONFIDENTIAL_COMPLIANCE_BASE_MAINNET:}
      base-testnet:     ${CONFIDENTIAL_COMPLIANCE_BASE_TESTNET:}
    # Registry operator's / an auditor's dedicated decrypt-only viewer addresses, granted as
    # initialViewers at confidential-token deploy time (see ConfidentialERC20's viewer-ACL note).
    # NOT on-chain transaction-signing wallets — the corresponding private keys live only in the
    # zama-relayer sidecar's OPERATOR_DECRYPT_PRIVATE_KEY, never in this backend.
    confidential-operator-viewer:
      ethereum-mainnet: ${CONFIDENTIAL_OPERATOR_VIEWER_ETH_MAINNET:}
      ethereum-testnet: ${CONFIDENTIAL_OPERATOR_VIEWER_ETH_TESTNET:}
      base-mainnet:     ${CONFIDENTIAL_OPERATOR_VIEWER_BASE_MAINNET:}
      base-testnet:     ${CONFIDENTIAL_OPERATOR_VIEWER_BASE_TESTNET:}
    confidential-auditor-viewer:
      ethereum-mainnet: ${CONFIDENTIAL_AUDITOR_VIEWER_ETH_MAINNET:}
      ethereum-testnet: ${CONFIDENTIAL_AUDITOR_VIEWER_ETH_TESTNET:}
      base-mainnet:     ${CONFIDENTIAL_AUDITOR_VIEWER_BASE_MAINNET:}
      base-testnet:     ${CONFIDENTIAL_AUDITOR_VIEWER_BASE_TESTNET:}
    # Ecosystem: org identity + permission framework + dApp marketplace anchoring.
    # Deployed once per chain via `forge script script/DeployEcosystem.s.sol`.
    org-registry:
      ethereum-mainnet:  ${ORG_REGISTRY_ETH_MAINNET:}
      ethereum-testnet:  ${ORG_REGISTRY_ETH_TESTNET:}
      polygon-mainnet:   ${ORG_REGISTRY_POLYGON_MAINNET:}
      polygon-testnet:   ${ORG_REGISTRY_POLYGON_TESTNET:}
      base-mainnet:      ${ORG_REGISTRY_BASE_MAINNET:}
      base-testnet:      ${ORG_REGISTRY_BASE_TESTNET:}
      arbitrum-mainnet:  ${ORG_REGISTRY_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${ORG_REGISTRY_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${ORG_REGISTRY_AVALANCHE_MAINNET:}
      avalanche-testnet: ${ORG_REGISTRY_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${ORG_REGISTRY_OPTIMISM_MAINNET:}
      optimism-testnet:  ${ORG_REGISTRY_OPTIMISM_TESTNET:}
    permission-registry:
      ethereum-mainnet:  ${PERMISSION_REGISTRY_ETH_MAINNET:}
      ethereum-testnet:  ${PERMISSION_REGISTRY_ETH_TESTNET:}
      polygon-mainnet:   ${PERMISSION_REGISTRY_POLYGON_MAINNET:}
      polygon-testnet:   ${PERMISSION_REGISTRY_POLYGON_TESTNET:}
      base-mainnet:      ${PERMISSION_REGISTRY_BASE_MAINNET:}
      base-testnet:      ${PERMISSION_REGISTRY_BASE_TESTNET:}
      arbitrum-mainnet:  ${PERMISSION_REGISTRY_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${PERMISSION_REGISTRY_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${PERMISSION_REGISTRY_AVALANCHE_MAINNET:}
      avalanche-testnet: ${PERMISSION_REGISTRY_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${PERMISSION_REGISTRY_OPTIMISM_MAINNET:}
      optimism-testnet:  ${PERMISSION_REGISTRY_OPTIMISM_TESTNET:}
    permission-oracle:
      ethereum-mainnet:  ${PERMISSION_ORACLE_ETH_MAINNET:}
      ethereum-testnet:  ${PERMISSION_ORACLE_ETH_TESTNET:}
      polygon-mainnet:   ${PERMISSION_ORACLE_POLYGON_MAINNET:}
      polygon-testnet:   ${PERMISSION_ORACLE_POLYGON_TESTNET:}
      base-mainnet:      ${PERMISSION_ORACLE_BASE_MAINNET:}
      base-testnet:      ${PERMISSION_ORACLE_BASE_TESTNET:}
      arbitrum-mainnet:  ${PERMISSION_ORACLE_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${PERMISSION_ORACLE_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${PERMISSION_ORACLE_AVALANCHE_MAINNET:}
      avalanche-testnet: ${PERMISSION_ORACLE_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${PERMISSION_ORACLE_OPTIMISM_MAINNET:}
      optimism-testnet:  ${PERMISSION_ORACLE_OPTIMISM_TESTNET:}
    dapp-registry:
      ethereum-mainnet:  ${DAPP_REGISTRY_ETH_MAINNET:}
      ethereum-testnet:  ${DAPP_REGISTRY_ETH_TESTNET:}
      polygon-mainnet:   ${DAPP_REGISTRY_POLYGON_MAINNET:}
      polygon-testnet:   ${DAPP_REGISTRY_POLYGON_TESTNET:}
      base-mainnet:      ${DAPP_REGISTRY_BASE_MAINNET:}
      base-testnet:      ${DAPP_REGISTRY_BASE_TESTNET:}
      arbitrum-mainnet:  ${DAPP_REGISTRY_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${DAPP_REGISTRY_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${DAPP_REGISTRY_AVALANCHE_MAINNET:}
      avalanche-testnet: ${DAPP_REGISTRY_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${DAPP_REGISTRY_OPTIMISM_MAINNET:}
      optimism-testnet:  ${DAPP_REGISTRY_OPTIMISM_TESTNET:}
    ecosystem-tir:
      ethereum-mainnet:  ${ECOSYSTEM_TIR_ETH_MAINNET:}
      ethereum-testnet:  ${ECOSYSTEM_TIR_ETH_TESTNET:}
      polygon-mainnet:   ${ECOSYSTEM_TIR_POLYGON_MAINNET:}
      polygon-testnet:   ${ECOSYSTEM_TIR_POLYGON_TESTNET:}
      base-mainnet:      ${ECOSYSTEM_TIR_BASE_MAINNET:}
      base-testnet:      ${ECOSYSTEM_TIR_BASE_TESTNET:}
      arbitrum-mainnet:  ${ECOSYSTEM_TIR_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${ECOSYSTEM_TIR_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${ECOSYSTEM_TIR_AVALANCHE_MAINNET:}
      avalanche-testnet: ${ECOSYSTEM_TIR_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${ECOSYSTEM_TIR_OPTIMISM_MAINNET:}
      optimism-testnet:  ${ECOSYSTEM_TIR_OPTIMISM_TESTNET:}
    # ONCHAINID ClaimIssuer contract per chain: _issuer of backend-signed KYC/AML claims and the
    # trusted issuer of new T-REX suites. MANAGEMENT key = the chain's registry signer
    # (`forge script script/DeployClaimIssuer.s.sol`). Must be a contract, never an EOA.
    claim-issuer:
      ethereum-mainnet:  ${CLAIM_ISSUER_ETH_MAINNET:}
      ethereum-testnet:  ${CLAIM_ISSUER_ETH_TESTNET:}
      polygon-mainnet:   ${CLAIM_ISSUER_POLYGON_MAINNET:}
      polygon-testnet:   ${CLAIM_ISSUER_POLYGON_TESTNET:}
      base-mainnet:      ${CLAIM_ISSUER_BASE_MAINNET:}
      base-testnet:      ${CLAIM_ISSUER_BASE_TESTNET:}
      arbitrum-mainnet:  ${CLAIM_ISSUER_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${CLAIM_ISSUER_ARBITRUM_TESTNET:}
      avalanche-mainnet: ${CLAIM_ISSUER_AVALANCHE_MAINNET:}
      avalanche-testnet: ${CLAIM_ISSUER_AVALANCHE_TESTNET:}
      optimism-mainnet:  ${CLAIM_ISSUER_OPTIMISM_MAINNET:}
      optimism-testnet:  ${CLAIM_ISSUER_OPTIMISM_TESTNET:}
  documents:
    max-inline-bytes: 5242880
    s3:
      bucket: ${S3_BUCKET:registerwerk-documents}
      endpoint: ${S3_ENDPOINT:https://s3.amazonaws.com}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      region: ${S3_REGION:eu-central-1}
  onboarding:
    token-ttl-hours: 48
    user-action-ttl-hours: 48
    frontend-url: ${CUSTOMER_FRONTEND_URL:http://localhost:44201}
  mail:
    from: ${MAIL_USERNAME:noreply@registerwerk.example.com}
  admin:
    # Optional allow-list of e-mail domains for invited OPERATOR accounts (comma separated); empty = off.
    operator-email-domains: ${OPERATOR_EMAIL_DOMAINS:}
  access-review:
    # Role pairs (A+B, comma separated) that should not be held together. Shown per item as a
    # warning only; enforcement at role assignment is parked (T6-15).
    sod-conflicts: ${ACCESS_REVIEW_SOD_CONFLICTS:REGISTRY_ADMIN+COMPLIANCE_OFFICER}
  auth:
    # Link an IdP identity to an existing account by e-mail even when the token does not assert a
    # verified address (xms_edov / email_verified). Blank = allowed unless REGISTERWERK_PRODUCTION_MODE=true.
    link-by-email-without-verification: ${LINK_BY_EMAIL_WITHOUT_VERIFICATION:}
    # Built-in login brute-force throttle (operator path bypasses Kong rate limiting)
    login-max-attempts: ${REGISTERWERK_AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-lockout-minutes: ${REGISTERWERK_AUTH_LOGIN_LOCKOUT_MINUTES:15}
    # K3 (6-10): lock key is (e-mail, source address); doubling per episode up to this cap.
    login-max-lockout-minutes: ${REGISTERWERK_AUTH_LOGIN_MAX_LOCKOUT_MINUTES:240}
    # Failures from ONE address inside the window before that address is refused (password spray).
    login-ip-max-failures: ${REGISTERWERK_AUTH_LOGIN_IP_MAX_FAILURES:30}
    # Platform-wide failures per minute above which addresses that already failed are refused.
    login-global-max-failures-per-minute: ${REGISTERWERK_AUTH_LOGIN_GLOBAL_MAX_FAILURES:600}
    # Bound on login_attempt rows (unknown e-mails create rows); new account rows stop above this.
    login-max-tracked-keys: ${REGISTERWERK_AUTH_LOGIN_MAX_TRACKED_KEYS:200000}
    login-max-delay-millis: 4000
    # Peers whose X-Forwarded-For is believed (regex, Tomcat internal-proxies syntax). Default: the
    # private/loopback ranges, i.e. the operator nginx / Kong / ingress in front of the backend.
    trusted-proxies: ${REGISTERWERK_AUTH_TRUSTED_PROXIES:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|169\.254\.\d+\.\d+|127\.\d+\.\d+\.\d+|172\.(?:1[6-9]|2\d|3[0-1])\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}
    entra-enabled: ${ENTRA_ENABLED:false}
    dev-secret: ${JWT_DEV_SECRET:registerwerk-dev-jwt-secret-change-in-production!!}
    token-ttl-seconds: 28800
    default-admin:
      email: ${DEFAULT_ADMIN_EMAIL:}
      password: ${DEFAULT_ADMIN_PASSWORD:}
    # Expected audience of incoming Entra access tokens. Without it, a token issued to any
    # other app in the same tenant validates against this API.
    audience: ${JWT_AUDIENCE:}
    step-up:
      # K3 (6-08): dual-control approver tokens are bound to action + target and single use; this is
      # the window in which an approver token is accepted after it was minted.
      dual-control:
        window-seconds: 300
        # Reasons whose target binding is enforced; "*" = all. Exists only to roll back a bad deploy.
        bind-target-reasons: "*"
        # Reasons whose approval additionally binds the canonical JSON request body (amounts, destinations and
        # override notes are part of what the approver reviewed). "*" = every reason: a body the approver did
        # not see must not be changeable afterwards.
        bind-body-reasons: "*"
        # Explicit opt-out. Method, path and query stay bound for these reasons; only the body is not. Keep this
        # list short - every entry weakens the four-eyes check:
        #  * payload that is not JSON and so has no canonical form an approver could reproduce: a multipart
        #    upload (term sheet, keystore) and a CSV import (its content is bound through the diffDigest query);
        #  * payload that IS secret key material or a keystore password, which must never be copied into an
        #    approval request that travels to a second person: raw key import, keystore export.
        body-opt-out-reasons: TERM_SHEET_AMENDMENT,WALLET_IMPORT_KEYSTORE,CASP_REGISTER_IMPORT,WALLET_IMPORT_RAW,WALLET_KEYSTORE_EXPORT
        max-body-bytes: 1048576
      entra:
        # Conditional Access authentication context (c1–c99) required for step-up-protected
        # actions when ENTRA_ENABLED=true. No default on purpose: guessing "c1" could mean
        # protecting forced transfers with a context that was never published to the app.
        auth-context-id: ${ENTRA_STEPUP_AUTH_CONTEXT_ID:}
        authorization-uri: ${ENTRA_AUTHORIZATION_URI:https://login.microsoftonline.com/common/oauth2/authorize}
        # Per-action overrides keyed on @RequiresStepUp#reason(). Several reasons are free text
        # with spaces, so quote those keys. Left unset here — an explicit `{}` binds as an empty
        # string rather than an empty map. Example:
        #   reason-overrides:
        #     FORCE_BURN_EWG26: c2
        #     "Payment rail creation": c1
  entra:
    tenant-id: ${ENTRA_TENANT_ID:}
    client-id: ${ENTRA_CLIENT_ID:}
    spa-client-id: ${ENTRA_SPA_CLIENT_ID:}
    client-secret: ${ENTRA_CLIENT_SECRET:}
    api-scope: ${ENTRA_API_SCOPE:}
    graph-base-url: ${ENTRA_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
    authority-base-url: ${ENTRA_AUTHORITY_BASE_URL:https://login.microsoftonline.com}
    # Master switch for every Microsoft Graph call (2FA status page + operator support console).
    # Independent of registerwerk.auth.entra-enabled, which only decides how users sign in.
    support-enabled: ${ENTRA_SUPPORT_ENABLED:false}
    mfa-setup-url: ${ENTRA_MFA_SETUP_URL:https://mysignins.microsoft.com/security-info}
    require-two-factor-enrolment: ${ENTRA_REQUIRE_2FA_ENROLMENT:false}
  # Screening controls (Phase 6 / K7; interim values for parked T6-03/T6-04)
  screening:
    match-threshold: 0.85            # recorded on every run as threshold_used
    accept-validity-days: 90         # accepted false positive may be carried forward this long
    carry-forward-score-tolerance: 0.05
    stale-clear-grace-hours: 24      # grace after the FIRST failed run of an outage
    stale-clear-max-age-hours: 72    # the relied-on good result may never be older than this
    retry-max-attempts: 6
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # Durable EVM outbox recovery (P4B-4; parked T4-03 interim). See OutboxProperties.
  outbox:
    backoff-base: PT15S
    backoff-max: PT5M
    per-signer-batch: 10
    batch-limit: 200
    auto-reprice-after-attempts: 4
    rebroadcast-after: PT10M
    stuck-after: PT10M
    replacement-bump-percent: 15
    lease-repair-grace: PT10M
    # Function names that may be re-priced without an operator once they keep failing for fee reasons.
    # Regulatory operations (forced transfer, burn, freeze, recovery, pause) are NEVER auto-replaced,
    # whatever is listed here; those wait for the operator's cancel / re-price (step-up + 4-eyes).
    # auto-reprice-methods: [registerIdentity, addClaim, ...]   # default list is in OutboxProperties
  blockchain:
    tx:
      # A transaction is only marked SUCCESS/FAILED once its receipt is this many blocks
      # deep, so a shallow reorg cannot leave the register asserting a dropped state.
      default-confirmations: ${REGISTERWERK_TX_DEFAULT_CONFIRMATIONS:12}
      # Un-mined (no receipt) transactions time out after this many seconds. A mined-but-
      # shallow transaction is never timed out — it waits until it reaches the depth above.
      timeout-seconds: ${REGISTERWERK_TX_TIMEOUT_SECONDS:900}
      # TIMEOUT is "not yet mined", not a failure (P4B-5): timed-out transactions keep being polled for
      # this long and are completed (SUCCESS/FAILED) when a receipt arrives; the nonce-consumed verdict
      # (REPLACED) needs the chain to have reported the nonce used for this long.
      late-mined-window-seconds: ${REGISTERWERK_TX_LATE_MINED_WINDOW_SECONDS:604800}
      replaced-confirmation-seconds: ${REGISTERWERK_TX_REPLACED_CONFIRMATION_SECONDS:600}
      # Pollers examine at most this many rows per run, oldest first, and stop at the deadline (7A-06).
      poll-batch-size: ${REGISTERWERK_TX_POLL_BATCH_SIZE:25}
      # Per-chain overrides (keyed by Chain enum name). Deeper for chains with weaker
      # finality / a history of reorgs.
      confirmations-by-chain:
        ETHEREUM: 12
        POLYGON: 128
        BASE: 30
        ARBITRUM: 20
        OPTIMISM: 30
        AVALANCHE: 12
  drift:
    check-interval-ms: ${REGISTERWERK_DRIFT_CHECK_INTERVAL_MS:900000}
    batch-size: ${REGISTERWERK_DRIFT_BATCH_SIZE:500}
  indexer:
    coverage:
      # P4-01 fail-closed guard: a deployment without a live, deployment-linked ingester blocks the
      # holder sync ("deployment not indexed") instead of reconciling against an empty history.
      # Production must keep this true; tests/demo seeding may relax it.
      enforce: ${REGISTERWERK_INDEXER_COVERAGE_ENFORCE:true}
      max-staleness: ${REGISTERWERK_INDEXER_COVERAGE_MAX_STALENESS:PT2H}
  payment:
    # 5A-11: chain-bound payment rails are checked against the chain at save (address holds code,
    # stablecoin decimals() equals the declared decimals); fails closed on RPC errors.
    onchain-verify: ${REGISTERWERK_PAYMENT_ONCHAIN_VERIFY:true}
  lending:
    local-demo-backend-rpc-url: ${LENDING_LOCAL_DEMO_BACKEND_RPC_URL:http://anvil:8545}
    local-demo-public-rpc-url: ${LENDING_LOCAL_DEMO_PUBLIC_RPC_URL:http://localhost:48545}
    # Fail closed until legal, custody, oracle, liquidation, and operating controls have
    # completed release review. Both flags are required; enabling only one refuses startup
    # or endpoint/service access.
    enabled: ${REGISTERWERK_LENDING_ENABLED:false}
    release-approved: ${REGISTERWERK_LENDING_RELEASE_APPROVED:false}
    # 5B-09: market registration requires the configured factory to vouch for the address. Tests only.
    require-factory: ${REGISTERWERK_LENDING_REQUIRE_FACTORY:true}
    # Optional output of contracts/script/DeployLocalLendingDemo.s.sol. Only the demo seeder
    # reads it; production deployments leave it blank.
    local-demo-addresses-file: ${REGISTERWERK_LENDING_LOCAL_DEMO_ADDRESSES_FILE:}
  # EwpgPaymaster voucher issuer (POST /api/v1/gas-sponsorship/vouchers). Each on-chain policy
  # registers this key's address as its policySigner. Dev only: a raw hex key — production moves
  # it to the KMS/HSM track. NEVER reuse the claim-signing (trusted-issuer) wallet key here.
  # Blank = no sponsorship (customers pay their own gas).
  paymaster:
    voucher-signer-key: ${REGISTERWERK_PAYMASTER_VOUCHER_SIGNER_KEY:}
    voucher-validity-seconds: ${REGISTERWERK_PAYMASTER_VOUCHER_VALIDITY_SECONDS:300}
    max-fee-per-gas-cap-wei: ${REGISTERWERK_PAYMASTER_MAX_FEE_PER_GAS_CAP_WEI:50000000000}
    max-total-gas: ${REGISTERWERK_PAYMASTER_MAX_TOTAL_GAS:3000000}
    # Share (0..1) of a policy's monthly cap one legal entity may consume per month.
    entity-monthly-cap-share: ${REGISTERWERK_PAYMASTER_ENTITY_MONTHLY_CAP_SHARE:0.10}
    # EwpgPaymaster address per chain identifier (deploy: contracts/script/DeployLiquidityDapps.s.sol)
    addresses:
      ethereum-mainnet:  ${PAYMASTER_ETH_MAINNET:}
      ethereum-testnet:  ${PAYMASTER_ETH_TESTNET:}
      polygon-mainnet:   ${PAYMASTER_POLYGON_MAINNET:}
      polygon-testnet:   ${PAYMASTER_POLYGON_TESTNET:}
      base-mainnet:      ${PAYMASTER_BASE_MAINNET:}
      base-testnet:      ${PAYMASTER_BASE_TESTNET:}
      arbitrum-mainnet:  ${PAYMASTER_ARBITRUM_MAINNET:}
      arbitrum-testnet:  ${PAYMASTER_ARBITRUM_TESTNET:}
      optimism-mainnet:  ${PAYMASTER_OPTIMISM_MAINNET:}
      optimism-testnet:  ${PAYMASTER_OPTIMISM_TESTNET:}
  repo-desk:
    enabled: ${REGISTERWERK_REPO_DESK_ENABLED:false}
    release-approved: ${REGISTERWERK_REPO_DESK_RELEASE_APPROVED:false}
    # T5-09 interim: minimum margin cure period and default grace after notice
    min-margin-cure-hours: ${REGISTERWERK_REPO_DESK_MIN_MARGIN_CURE_HOURS:24}
    default-grace-hours: ${REGISTERWERK_REPO_DESK_DEFAULT_GRACE_HOURS:24}
  # Phase 5 / K4: outbound webhook hardening (5D-08/5D-09). See webhook.internal.OutboundUrlPolicy.
  webhook:
    # Dev/local receivers only (http, any port, loopback/private targets). Refused at start-up when
    # REGISTERWERK_PRODUCTION_MODE=true.
    allow-insecure-urls: ${REGISTERWERK_WEBHOOK_ALLOW_INSECURE_URLS:false}
    allowed-ports: 443,8443
    connect-timeout-ms: 3000
    response-timeout-ms: 5000
    max-concurrency: 8
    max-per-host: 2
    sweep-batch-size: 100
    lease-seconds: 120
    max-attempts: 8
    circuit-breaker-failures: 20
    rotation-overlap-hours: 24
    replay-tolerance-seconds: 300
  trading:
    enabled: ${REGISTERWERK_TRADING_ENABLED:true}
    # T3-09: list/settle chain-deployed assets on the simulated venue without an on-chain leg.
    # Keep false outside a demo: the holder sync would reset the seller to its on-chain balance
    # while the buyer's off-chain row stays, so the register would exceed the supply.
    offchain-settlement-on-deployed-assets: ${REGISTERWERK_TRADING_OFFCHAIN_SETTLEMENT_ON_DEPLOYED_ASSETS:false}
    # 5A-01: DEMO ONLY. Lets a SIMULATED listing whose seller ticked "allow instant settlement" move the
    # register inside the buyer's request with NO cash leg. Refused at start-up in production mode.
    demo-instant-settlement: ${REGISTERWERK_TRADING_DEMO_INSTANT_SETTLEMENT:false}
    # 5A-06: reservation economics (T5-04 interim). Open reservations = PENDING + awaiting seller + unresolved.
    max-open-reservations-per-buyer: ${REGISTERWERK_TRADING_MAX_OPEN_RESERVATIONS_PER_BUYER:3}
    reservation-cooldown-hours: ${REGISTERWERK_TRADING_RESERVATION_COOLDOWN_HOURS:24}
    # 5A-03: PAYMENT_UNRESOLVED trades older than this raise the aged-unresolved gauge / hourly alert log.
    unresolved-alert-hours: ${REGISTERWERK_TRADING_UNRESOLVED_ALERT_HOURS:24}
    # 5C-06 (parked T5-06): DEMO_ONLY (default; peer listings refused in production mode) | BILATERAL_ONLY
    # (listings addressed to one named counterparty) | LICENSED_VENUE. Non-demo values need a legal-opinion-ref.
    venue-classification: ${REGISTERWERK_TRADING_VENUE_CLASSIFICATION:DEMO_ONLY}
    legal-opinion-ref: ${REGISTERWERK_TRADING_LEGAL_OPINION_REF:}
    # 5A-06 (T5-04): related parties (shared UBO / member / wallet) may not trade unless this is true.
    allow-related-party-trades: ${REGISTERWERK_TRADING_ALLOW_RELATED_PARTY_TRADES:false}
    # 5A-06 (T5-04): price collar vs the last unrelated trade price in basis points; 0 = off.
    max-price-deviation-bps: ${REGISTERWERK_TRADING_MAX_PRICE_DEVIATION_BPS:0}
    # 5A-02 (T5-03): ISO 4217 currencies accepted for SEPA / CBMT / Pontes listings.
    fiat-currencies: ${REGISTERWERK_TRADING_FIAT_CURRENCIES:EUR}
    venues:
      simulated:
        enabled: ${REGISTERWERK_TRADING_VENUE_SIMULATED_ENABLED:true}
      assetera:
        enabled: ${REGISTERWERK_TRADING_VENUE_ASSETERA_ENABLED:true}
        base-url: ${REGISTERWERK_TRADING_VENUE_ASSETERA_BASE_URL:}
        api-key: ${REGISTERWERK_TRADING_VENUE_ASSETERA_API_KEY:}
      archax:
        enabled: ${REGISTERWERK_TRADING_VENUE_ARCHAX_ENABLED:true}
        base-url: ${REGISTERWERK_TRADING_VENUE_ARCHAX_BASE_URL:}
        api-key: ${REGISTERWERK_TRADING_VENUE_ARCHAX_API_KEY:}
      talos:
        enabled: ${REGISTERWERK_TRADING_VENUE_TALOS_ENABLED:true}
        base-url: ${REGISTERWERK_TRADING_VENUE_TALOS_BASE_URL:}
        api-key: ${REGISTERWERK_TRADING_VENUE_TALOS_API_KEY:}
  travel-rule:
    protocol: ${REGISTERWERK_TRAVEL_RULE_PROTOCOL:NOOP}
    # Credential for inbound IVMS-101 delivery. Blank disables the public inbox (fail closed).
    # DEPRECATED (6-29): per-peer HMAC credentials (travel_rule_peer) replace the shared key. The key is only
    # honoured with legacy-shared-key=true and never in production mode.
    inbox-api-key: ${REGISTERWERK_TRAVEL_RULE_INBOX_API_KEY:}
    legacy-shared-key: ${REGISTERWERK_TRAVEL_RULE_LEGACY_SHARED_KEY:false}
    # The operator's own VASP identity: originatingVasp of every outbound message (6-26). Required in production.
    own-vasp:
      did: ${REGISTERWERK_TRAVEL_RULE_OWN_VASP_DID:}
      lei: ${REGISTERWERK_TRAVEL_RULE_OWN_VASP_LEI:}
      legal-name: ${REGISTERWERK_TRAVEL_RULE_OWN_VASP_LEGAL_NAME:}
    # A gated operation waits at most this long for the protocol to accept the message (then it is refused).
    send-timeout-seconds: ${REGISTERWERK_TRAVEL_RULE_SEND_TIMEOUT_SECONDS:15}
    # Legal position (parked T6-06): off until signed off.
    register-internal-exempt: ${REGISTERWERK_TRAVEL_RULE_REGISTER_INTERNAL_EXEMPT:false}
    wallet-proof-validity-days: ${REGISTERWERK_TRAVEL_RULE_WALLET_PROOF_VALIDITY_DAYS:365}
    # Art. 14(5) TFR: ownership verification threshold for self-hosted addresses.
    # NOTE: this is NOT a messaging threshold — TFR has no de minimis for CASP-to-CASP transfers.
    self-hosted-verification-threshold-eur: ${REGISTERWERK_TRAVEL_RULE_SELF_HOSTED_VERIFICATION_THRESHOLD_EUR:1000}
    # EU-wide end of the MiCA transitional period (ESMA statement, 17 Apr 2026)
    mica-enforcement-date: ${REGISTERWERK_TRAVEL_RULE_MICA_ENFORCEMENT_DATE:2026-07-01}
    notabene:
      base-url: ${REGISTERWERK_TRAVEL_RULE_NOTABENE_BASE_URL:https://api.notabene.id}
      api-key: ${REGISTERWERK_TRAVEL_RULE_NOTABENE_API_KEY:}
      vasp-did: ${REGISTERWERK_TRAVEL_RULE_NOTABENE_VASP_DID:}
    trp:
      endpoint: ${REGISTERWERK_TRAVEL_RULE_TRP_ENDPOINT:}
      # PEM certificate + unencrypted PKCS#8 PEM private key. Invalid/partial mTLS config fails startup.
      mtls-cert-path: ${REGISTERWERK_TRAVEL_RULE_TRP_MTLS_CERT:}
      mtls-key-path: ${REGISTERWERK_TRAVEL_RULE_TRP_MTLS_KEY:}
      directory-url: ${REGISTERWERK_TRAVEL_RULE_TRP_DIRECTORY_URL:https://trp.notabene.id/directory}
      # Optional allow-list of delivery hosts (empty = any public https host).
      allowed-hosts: []
  reporting:
    # Non-production prototype only. Outputs are DRAFT_UNVALIDATED; SFTP proves transport,
    # not filing or authority acceptance. Production readiness guard rejects enabling this.
    prototype-enabled: ${REGISTERWERK_REPORTING_PROTOTYPE_ENABLED:false}
    operator-tin: ${REGISTERWERK_OPERATOR_TIN:}
    operator-lei: ${REGISTERWERK_OPERATOR_LEI:}
    document-bucket: ${REGISTERWERK_REPORTING_S3_BUCKET:registerwerk-reports}
    gateway: ${REGISTERWERK_REPORTING_GATEWAY:NOOP}
    sftp:
      DE_BAFIN:
        host: ${REGISTERWERK_REPORTING_SFTP_DE_HOST:}
        port: ${REGISTERWERK_REPORTING_SFTP_DE_PORT:22}
        username: ${REGISTERWERK_REPORTING_SFTP_DE_USER:}
        private-key-path: ${REGISTERWERK_REPORTING_SFTP_DE_KEY:}
        remote-dir: ${REGISTERWERK_REPORTING_SFTP_DE_DIR:/incoming/mifir/}
      FR_AMF:
        host: ${REGISTERWERK_REPORTING_SFTP_FR_HOST:}
        port: ${REGISTERWERK_REPORTING_SFTP_FR_PORT:22}
        username: ${REGISTERWERK_REPORTING_SFTP_FR_USER:}
        private-key-path: ${REGISTERWERK_REPORTING_SFTP_FR_KEY:}
        remote-dir: ${REGISTERWERK_REPORTING_SFTP_FR_DIR:/incoming/mifir/}
  register:
    # T3-05/T3-06: the zone the register's calendar days are counted in — "today" for the
    # corporate-action jobs, their cron triggers, and the record-date cut-off (entitlements are
    # fixed as of the END of the record date in this zone, not in the JVM's zone, which is UTC in
    # containers).
    time-zone: ${REGISTER_TIME_ZONE:Europe/Berlin}
    # A chain-deployed register is snapshotted only after a successful holder sync at least this
    # long after the record-date cut-off, so the indexer has provably seen the chain past it.
    snapshot-sync-margin: ${REGISTER_SNAPSHOT_SYNC_MARGIN:PT30M}
  sync:
    # Auto-refresh interval in minutes for holder data sync from blockchain (0 = disabled)
    auto-refresh-interval-minutes: ${SYNC_INTERVAL_MINUTES:15}
    # Maximum number of issuances to sync per scheduler run
    batch-size: ${SYNC_BATCH_SIZE:50}
    # Enable verbose logging for sync operations
    log-sync-operations: ${SYNC_LOG_OPERATIONS:false}
    # T2-18: the operator's legal entity (legal_entity.id) that nominee-pool holder rows for pool
    # contracts (lending markets, DvP escrow, desk, facility) are held in. Blank = lending markets
    # are not auto-registered; their collateral asset's sync then turns BLOCKED until an operator
    # registers the pool address manually (asset detail -> "Register pool address").
    nominee-pool-entity-id: ${SYNC_NOMINEE_POOL_ENTITY_ID:}
  audit:
    # Phase 6 / K4: capture + resubmission. legacy-listener drains event publications created before
    # the capture listener existed (switch off once event_publication has no incomplete audit rows);
    # allow-owner-runtime-role acknowledges the interim "runtime login owns audit_event" risk in
    # production mode (T6-17: split migrator/runtime roles); max-attempts = dead-letter threshold.
    legacy-listener: ${REGISTERWERK_AUDIT_LEGACY_LISTENER:true}
    allow-owner-runtime-role: ${REGISTERWERK_AUDIT_ALLOW_OWNER_RUNTIME_ROLE:false}
    max-attempts: 20
    resubmit-older-than-seconds: 120
    signing:
      # Blank (default) = no signing provider active; the audit_event hash chain is still
      # WORM-protected and verified, just without a signature anchored outside the database.
      # ENV_VAR = dev/test-only (EnvVarEd25519SigningKeyProvider, opt-in, not for production).
      # GCP_KMS = real KMS-backed signing (GcpKmsEd25519SigningKeyProvider) — see its Javadoc
      # for why AWS KMS/Azure Key Vault aren't offered (neither supports Ed25519 signing keys).
      provider: ${REGISTERWERK_AUDIT_SIGNING_PROVIDER:}
      seed: ${REGISTERWERK_AUDIT_SIGNING_SEED:}
      gcp-kms:
        key-version: ${REGISTERWERK_AUDIT_SIGNING_GCP_KMS_KEY_VERSION:}
