plugins:
  - name: proxy-cache
    service: registerwerk-backend
    config:
      response_code: [200, 301]
      request_method: [GET, HEAD]
      content_type:
        - application/json
        - application/json; charset=utf-8
      cache_ttl: 30
      strategy: memory
      cache_control: false
      storage_ttl: 300
