# Named explicitly (rather than left to Compose's directory-name default) so the network
# monitoring/docker-compose.yml joins as "registerwerk_default" is deterministic regardless
# of what directory this repo is checked out into (Phase 12, finding #4).
name: registerwerk

services:
  # ─── Application Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: registerwerk
      POSTGRES_USER: ${DB_USER:-registerwerk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-registerwerk}
      DB_USER: ${DB_USER:-registerwerk}
      DB_PASSWORD: ${DB_PASSWORD:-registerwerk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-registerwerk} -d registerwerk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/registerwerk
      DB_USER: ${DB_USER:-registerwerk}
      DB_PASSWORD: ${DB_PASSWORD:-registerwerk}
      # This compose file is the local/demo deployment path (see CLAUDE.md). Without an
      # active "dev"/"test" profile, SecurityConfig.jwtDecoder() refuses to start at all
      # when JWT_DEV_SECRET is left at its factory default below and JWT_ISSUER_URI is
      # blank — by design, to stop that default secret from reaching a real deployment.
      # Override to blank/"production" once JWT_ISSUER_URI and a real JWT_DEV_SECRET are set.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      ENTRA_ENABLED: ${ENTRA_ENABLED:-false}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      JWT_DEV_SECRET: ${JWT_DEV_SECRET:-registerwerk-dev-jwt-secret-change-in-production!!}
      # Microsoft Entra ID. All blank by default, which is what keeps this a local/demo stack:
      # ENTRA_ENABLED=false means built-in login, and ENTRA_SUPPORT_ENABLED=false means nothing
      # here ever reaches out to Microsoft Graph. See docs/platform/entra-setup.md.
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_SPA_CLIENT_ID: ${ENTRA_SPA_CLIENT_ID:-}
      ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-}
      ENTRA_SUPPORT_ENABLED: ${ENTRA_SUPPORT_ENABLED:-false}
      ENTRA_GRAPH_BASE_URL: ${ENTRA_GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      ENTRA_STEPUP_AUTH_CONTEXT_ID: ${ENTRA_STEPUP_AUTH_CONTEXT_ID:-}
      ENTRA_AUTHORIZATION_URI: ${ENTRA_AUTHORIZATION_URI:-https://login.microsoftonline.com/common/oauth2/authorize}
      ENTRA_MFA_SETUP_URL: ${ENTRA_MFA_SETUP_URL:-https://mysignins.microsoft.com/security-info}
      ENTRA_REQUIRE_2FA_ENROLMENT: ${ENTRA_REQUIRE_2FA_ENROLMENT:-false}
      ETH_MAINNET_RPC: ${ETH_MAINNET_RPC}
      ETH_SEPOLIA_RPC: ${ETH_SEPOLIA_RPC}
      POLYGON_MAINNET_RPC: ${POLYGON_MAINNET_RPC}
      POLYGON_AMOY_RPC: ${POLYGON_AMOY_RPC}
      BASE_MAINNET_RPC: ${BASE_MAINNET_RPC}
      BASE_SEPOLIA_RPC: ${BASE_SEPOLIA_RPC}
      SOLANA_MAINNET_RPC: ${SOLANA_MAINNET_RPC}
      SOLANA_DEVNET_RPC: ${SOLANA_DEVNET_RPC}
      ARBITRUM_MAINNET_RPC: ${ARBITRUM_MAINNET_RPC:-https://arbitrum.publicnode.com}
      ARBITRUM_SEPOLIA_RPC: ${ARBITRUM_SEPOLIA_RPC:-https://sepolia-rollup.arbitrum.io/rpc}
      AVALANCHE_MAINNET_RPC: ${AVALANCHE_MAINNET_RPC:-https://api.avax.network/ext/bc/C/rpc}
      AVALANCHE_FUJI_RPC: ${AVALANCHE_FUJI_RPC:-https://api.avax-test.network/ext/bc/C/rpc}
      OPTIMISM_MAINNET_RPC: ${OPTIMISM_MAINNET_RPC:-https://mainnet.optimism.io}
      OPTIMISM_SEPOLIA_RPC: ${OPTIMISM_SEPOLIA_RPC:-https://sepolia.optimism.io}
      # Dev-only fallback so a bare `docker compose up` without an .env doesn't
      # crash-loop the backend (WalletProperties requires >= 32 chars). Override
      # in .env for any real deployment.
      REGISTERWERK_WALLET_MASTER_KEY: ${REGISTERWERK_WALLET_MASTER_KEY:-registerwerk-dev-wallet-master-key-change-in-production}
      REGISTERWERK_WALLET_DIR: /data/wallets
      S3_BUCKET: ${S3_BUCKET:-registerwerk-documents}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-eu-central-1}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CUSTOMER_FRONTEND_URL: ${CUSTOMER_FRONTEND_URL:-http://localhost:4201}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Repo/lending ships fail-closed in application.yml; the dev stack opts in so the
      # feature is exercisable locally. Both flags are required (LendingProductionReadinessCheck
      # refuses a partially enabled deployment).
      REGISTERWERK_LENDING_ENABLED: ${REGISTERWERK_LENDING_ENABLED:-true}
      REGISTERWERK_LENDING_RELEASE_APPROVED: ${REGISTERWERK_LENDING_RELEASE_APPROVED:-true}
      REGISTERWERK_TRADING_ENABLED: ${REGISTERWERK_TRADING_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_SIMULATED_ENABLED: ${REGISTERWERK_TRADING_VENUE_SIMULATED_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_ASSETERA_ENABLED: ${REGISTERWERK_TRADING_VENUE_ASSETERA_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_ASSETERA_BASE_URL: ${REGISTERWERK_TRADING_VENUE_ASSETERA_BASE_URL:-}
      REGISTERWERK_TRADING_VENUE_ASSETERA_API_KEY: ${REGISTERWERK_TRADING_VENUE_ASSETERA_API_KEY:-}
      REGISTERWERK_TRADING_VENUE_ARCHAX_ENABLED: ${REGISTERWERK_TRADING_VENUE_ARCHAX_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_ARCHAX_BASE_URL: ${REGISTERWERK_TRADING_VENUE_ARCHAX_BASE_URL:-}
      REGISTERWERK_TRADING_VENUE_ARCHAX_API_KEY: ${REGISTERWERK_TRADING_VENUE_ARCHAX_API_KEY:-}
      REGISTERWERK_TRADING_VENUE_TALOS_ENABLED: ${REGISTERWERK_TRADING_VENUE_TALOS_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_TALOS_BASE_URL: ${REGISTERWERK_TRADING_VENUE_TALOS_BASE_URL:-}
      REGISTERWERK_TRADING_VENUE_TALOS_API_KEY: ${REGISTERWERK_TRADING_VENUE_TALOS_API_KEY:-}
      # Confidential (Zama fhEVM) tokens — the operator-initiated encrypt/decrypt path only;
      # investor/issuer/auditor self-decrypt and investor confidential-transfer encryption happen
      # entirely client-side in the frontends (FheClientService), never through this backend.
      REGISTERWERK_ZAMA_RELAYER_URL: ${REGISTERWERK_ZAMA_RELAYER_URL:-http://zama-relayer:3001}
      REGISTERWERK_ZAMA_RELAYER_API_KEY: ${ZAMA_RELAYER_API_KEY:-registerwerk-dev-zama-relayer-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - registerwerk_wallets:/data/wallets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500m

  # ─── Zama Relayer Sidecar ───────────────────────────────────────────────────
  # Registerwerk's own wrapper around @zama-fhe/relayer-sdk (see zama-relayer/README and
  # docs/token-standards/confidential.md) — not an external dependency, this is our code, built
  # and shipped in this monorepo. Exists only because Zama publishes no Java/JVM client; the
  # frontends talk to Zama's relayer directly in the browser for every user-initiated flow.
  # Backend calls this for operator/issuer-initiated confidential mint/force-burn (encrypt-input)
  # and headless operator/auditor balance reconciliation (operator-decrypt) — see
  # ConfidentialTokenAdminService / ConfidentialBalanceReconciliationService.
  zama-relayer:
    build:
      context: ./zama-relayer
      dockerfile: Dockerfile
      network: host
    environment:
      ZAMA_CONFIG_PRESET: ${ZAMA_CONFIG_PRESET:-sepolia}
      CHAIN_ID: ${ZAMA_CHAIN_ID:-11155111}
      SEPOLIA_NETWORK_RPC_URL: ${ETH_SEPOLIA_RPC}
      NETWORK_RPC_URL: ${ZAMA_NETWORK_RPC_URL:-}
      RELAYER_URL: ${ZAMA_RELAYER_UPSTREAM_URL:-}
      GATEWAY_CHAIN_ID: ${ZAMA_GATEWAY_CHAIN_ID:-}
      ACL_CONTRACT_ADDRESS: ${ZAMA_ACL_CONTRACT_ADDRESS:-}
      KMS_CONTRACT_ADDRESS: ${ZAMA_KMS_CONTRACT_ADDRESS:-}
      INPUT_VERIFIER_CONTRACT_ADDRESS: ${ZAMA_INPUT_VERIFIER_CONTRACT_ADDRESS:-}
      VERIFYING_CONTRACT_ADDRESS_DECRYPTION: ${ZAMA_VERIFYING_CONTRACT_ADDRESS_DECRYPTION:-}
      VERIFYING_CONTRACT_ADDRESS_INPUT_VERIFICATION: ${ZAMA_VERIFYING_CONTRACT_ADDRESS_INPUT_VERIFICATION:-}
      # Dedicated decrypt-only viewer key — deliberately NOT any chain's on-chain
      # transaction-signing wallet (registry wallets configured via Operator Portal → Wallets).
      # Its public address must be registered as a viewer (addViewer / deploy-time
      # initialViewers) on any confidential token the operator needs to reconcile.
      OPERATOR_DECRYPT_PRIVATE_KEY: ${ZAMA_OPERATOR_DECRYPT_PRIVATE_KEY:-}
      # Finding #6, Phase 9: shared secret every /v1/* caller must present — see auth.ts. Same
      # value the backend sends above (REGISTERWERK_ZAMA_RELAYER_API_KEY); keep them in sync.
      RELAYER_API_KEY: ${ZAMA_RELAYER_API_KEY:-registerwerk-dev-zama-relayer-key-change-in-production}
      PORT: 3001
    profiles: [confidential]
    ports:
      - "127.0.0.1:3005:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Operator Frontend ────────────────────────────────────────────────────
  frontend-operator:
    build:
      context: .
      dockerfile: frontend-operator/Dockerfile
      network: host
      args:
        BUILD_CONFIG: ${FRONTEND_BUILD_ENV:-production}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ─── Customer Frontend ─────────────────────────────────────────────────────
  frontend-customer:
    build:
      context: .
      dockerfile: frontend-customer/Dockerfile
      network: host
      args:
        BUILD_CONFIG: ${FRONTEND_BUILD_ENV:-production}
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "4201:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ─── API Gateway ────────────────────────────────────────────────────────────
  # DB-less (declarative) mode: gateway/kong.yml is the single source of truth
  # for routes/plugins and is actually loaded — Kong in DB mode ignores mounted
  # declarative files, which is why this used to route nothing. JWT validation
  # still happens in the Spring backend (see gateway/kong.yml header comment);
  # Kong here only handles caching, rate limiting, CORS, and security headers.
  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PLUGINS: bundled
    volumes:
      - ./gateway/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8443:8443"
      # Kong admin port must NOT be exposed publicly. Access via: docker exec or SSH tunnel.
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Documentation Server ─────────────────────────────────────────────────
  # Enable by setting COMPOSE_PROFILES=docs in your environment or .env file.
  # Access at http://<host>:8003 once the service is up.
  # Binds to 0.0.0.0 by default so it is reachable on remote hosts.
  # Set DOCS_BIND_ADDR=127.0.0.1 in .env to restrict to loopback only.
  docs:
    image: squidfunk/mkdocs-material:9.5
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./docs:/docs/docs:ro
    ports:
      - "${DOCS_BIND_ADDR:-0.0.0.0}:8003:8000"
    command: serve --dev-addr=0.0.0.0:8000
    profiles: [docs]
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  registerwerk_wallets:
