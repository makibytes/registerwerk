services:
  # ─── Application Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: registerwerk
      POSTGRES_USER: ${DB_USER:-registerwerk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-registerwerk}
      DB_USER: ${DB_USER:-registerwerk}
      DB_PASSWORD: ${DB_PASSWORD:-registerwerk}
      KONG_DB_USER: ${KONG_DB_USER:-kong}
      KONG_DB_PASSWORD: ${KONG_DB_PASSWORD:-kong}
      KONGA_DB_USER: ${KONGA_DB_USER:-konga}
      KONGA_DB_PASSWORD: ${KONGA_DB_PASSWORD:-konga}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-registerwerk} -d registerwerk"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/registerwerk
      DB_USER: ${DB_USER:-registerwerk}
      DB_PASSWORD: ${DB_PASSWORD:-registerwerk}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
      ENTRA_ENABLED: ${ENTRA_ENABLED:-false}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      JWT_DEV_SECRET: ${JWT_DEV_SECRET:-registerwerk-dev-jwt-secret-change-in-production!!}
      ETH_MAINNET_RPC: ${ETH_MAINNET_RPC}
      ETH_SEPOLIA_RPC: ${ETH_SEPOLIA_RPC}
      POLYGON_MAINNET_RPC: ${POLYGON_MAINNET_RPC}
      POLYGON_AMOY_RPC: ${POLYGON_AMOY_RPC}
      BASE_MAINNET_RPC: ${BASE_MAINNET_RPC}
      BASE_SEPOLIA_RPC: ${BASE_SEPOLIA_RPC}
      SOLANA_MAINNET_RPC: ${SOLANA_MAINNET_RPC}
      SOLANA_DEVNET_RPC: ${SOLANA_DEVNET_RPC}
      REGISTERWERK_WALLET_MASTER_KEY: ${REGISTERWERK_WALLET_MASTER_KEY}
      REGISTERWERK_WALLET_DIR: /data/wallets
      S3_BUCKET: ${S3_BUCKET:-registerwerk-documents}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-eu-central-1}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CUSTOMER_FRONTEND_URL: ${CUSTOMER_FRONTEND_URL:-http://localhost:4201}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      REGISTERWERK_TRADING_ENABLED: ${REGISTERWERK_TRADING_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_SIMULATED_ENABLED: ${REGISTERWERK_TRADING_VENUE_SIMULATED_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_ASSETERA_ENABLED: ${REGISTERWERK_TRADING_VENUE_ASSETERA_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_ASSETERA_BASE_URL: ${REGISTERWERK_TRADING_VENUE_ASSETERA_BASE_URL:-}
      REGISTERWERK_TRADING_VENUE_ASSETERA_API_KEY: ${REGISTERWERK_TRADING_VENUE_ASSETERA_API_KEY:-}
      REGISTERWERK_TRADING_VENUE_ARCHAX_ENABLED: ${REGISTERWERK_TRADING_VENUE_ARCHAX_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_ARCHAX_BASE_URL: ${REGISTERWERK_TRADING_VENUE_ARCHAX_BASE_URL:-}
      REGISTERWERK_TRADING_VENUE_ARCHAX_API_KEY: ${REGISTERWERK_TRADING_VENUE_ARCHAX_API_KEY:-}
      REGISTERWERK_TRADING_VENUE_TALOS_ENABLED: ${REGISTERWERK_TRADING_VENUE_TALOS_ENABLED:-true}
      REGISTERWERK_TRADING_VENUE_TALOS_BASE_URL: ${REGISTERWERK_TRADING_VENUE_TALOS_BASE_URL:-}
      REGISTERWERK_TRADING_VENUE_TALOS_API_KEY: ${REGISTERWERK_TRADING_VENUE_TALOS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - registerwerk_wallets:/data/wallets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500m

  # ─── Operator Frontend ────────────────────────────────────────────────────
  frontend-operator:
    build:
      context: ./frontend-operator
      dockerfile: Dockerfile
      network: host
      args:
        BUILD_CONFIG: ${FRONTEND_BUILD_ENV:-production}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ─── Customer Frontend ─────────────────────────────────────────────────────
  frontend-customer:
    build:
      context: ./frontend-customer
      dockerfile: Dockerfile
      network: host
      args:
        BUILD_CONFIG: ${FRONTEND_BUILD_ENV:-production}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4201:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ─── Kong/Konga DB Bootstrap ──────────────────────────────────────────────
  # Runs on every `docker compose up` (script is idempotent) so that operators
  # upgrading from an existing pgdata volume still get the kong/konga DBs created.
  db-bootstrap:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-registerwerk}
      PGHOST: postgres
      PGPASSWORD: ${DB_PASSWORD:-registerwerk}
      KONG_DB_USER: ${KONG_DB_USER:-kong}
      KONG_DB_PASSWORD: ${KONG_DB_PASSWORD:-kong}
      KONGA_DB_USER: ${KONGA_DB_USER:-konga}
      KONGA_DB_PASSWORD: ${KONGA_DB_PASSWORD:-konga}
    volumes:
      - ./docker/postgres/init:/scripts:ro
    entrypoint: ["sh", "/scripts/01-create-service-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ─── Kong Database ─────────────────────────────────────────────────────────
  kong-migrations:
    image: kong:3.8
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: ${KONG_DB_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong}
      KONG_PG_DATABASE: kong
    depends_on:
      postgres:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    restart: on-failure

  kong:
    image: kong:3.8
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: ${KONG_DB_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong}
      KONG_PG_DATABASE: kong
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    depends_on:
      postgres:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
      - "8443:8443"
      # Kong admin port must NOT be exposed publicly. Access via: docker exec or SSH tunnel.
      # - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  konga:
    # pantsel/konga is unmaintained since 2020. Replace with Kong Manager (Kong Gateway 3.x)
    # or remove entirely and access Kong admin via SSH tunnel to 127.0.0.1:8001.
    image: pantsel/konga:0.14.9
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: konga
      DB_USER: ${KONGA_DB_USER:-konga}
      DB_PASSWORD: ${KONGA_DB_PASSWORD:-konga}
    depends_on:
      postgres:
        condition: service_healthy
      kong:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:1337:1337"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
  registerwerk_wallets:
