groups:
  - name: registerwerk.critical
    interval: 1m
    rules:

      # ── Audit chain integrity (eWpRV §6) ─────────────────────────────────
      # Emitted by AuditChainVerificationService.
      - alert: AuditChainBroken
        expr: |
          registerwerk_audit_chain_valid{job="registerwerk-backend"} == 0
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Audit chain integrity BROKEN"
          description: "The SHA-256 hash chain of audit_event has been violated. Immediate investigation required. DORA Art. 17 major incident."

      # The verdict gauge is -1 while no verification has run yet (7B-04). That is fine during the
      # first deploy window, not after it: a verifier that never produces a verdict is as bad as a
      # broken chain.
      - alert: AuditChainUnverified
        expr: |
          registerwerk_audit_chain_valid{job="registerwerk-backend"} == -1
        for: 10m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Audit chain has no verification verdict"
          description: "registerwerk_audit_chain_valid has been -1 (never verified) for 10 minutes. The verifier is not running or cannot reach the database."

      - alert: AuditChainVerificationStale
        expr: |
          time() - registerwerk_audit_chain_last_verified_timestamp_seconds{job="registerwerk-backend"} > 93600
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Audit chain not verified for over 26 hours"
          description: "The daily audit-chain verification has not completed in 26h; the in-memory verdict may be out of date."

      # Tip not advancing although events are waiting to be chained (uses the existing
      # incomplete-capture gauge; there is no per-event counter to take a rate of).
      - alert: AuditChainTipStalled
        expr: |
          registerwerk_audit_chain_tip_age_seconds{job="registerwerk-backend"} > 1800
          and registerwerk_audit_oldest_incomplete_seconds{job="registerwerk-backend"} > 0
        for: 5m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Audit chain tip has not advanced for 30+ minutes"
          description: "The chain tip is older than 30 minutes while audit events are still waiting to be appended. The appender is stalled."

      # ── Indexer liveness ──────────────────────────────────────────────────
      # registerwerk_indexer_last_sync_timestamp_seconds is a Unix-epoch timestamp gauge
      # (IndexerMonitorService), not a precomputed age — time() - metric is the idiomatic
      # Prometheus pattern and stays accurate between the job's 5-minute updates.
      - alert: IndexerStaleCritical
        expr: |
          time() - registerwerk_indexer_last_sync_timestamp_seconds > 7200
        for: 2m
        labels:
          severity: critical
          dora_category: INDEXER_STALE
        annotations:
          summary: "Indexer stale > 2h"
          description: "Indexer type {{ $labels.indexer_type }} (chain_config_id={{ $labels.chain_config_id }}) has not synced for more than 2 hours."

      - alert: IndexerStaleWarning
        expr: |
          time() - registerwerk_indexer_last_sync_timestamp_seconds > 1800
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Indexer stale > 30 min"
          description: "Indexer type {{ $labels.indexer_type }} (chain_config_id={{ $labels.chain_config_id }}) has not synced for more than 30 minutes."

      # ── Chain drift ───────────────────────────────────────────────────────
      # registerwerk_chain_drift_open_total (ChainDriftDetectionJob) is a live COUNT of OPEN
      # rows, not a counter — alerts on the count being nonzero rather than increase().
      - alert: ChainDriftDetected
        expr: |
          registerwerk_chain_drift_open_total{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
          dora_category: CHAIN_DRIFT
        annotations:
          summary: "Chain ↔ DB balance drift detected"
          description: "{{ $value }} OPEN chain_drift_event row(s) — on-chain balances diverge from the registry DB (canonical per eWpG §16)."

      # ── Register reconciliation (T2-18) ───────────────────────────────────
      # Live counts from the DB (asset.holder_sync_status / corporate_action.status), not counters.
      # A BLOCKED holder sync means finalized balances sit on wallets with no holder row (typically
      # a pool contract without a nominee-pool row); the register is stale until it is resolved.
      - alert: HolderSyncBlocked
        expr: |
          registerwerk_holder_sync_blocked_assets{job="registerwerk-backend"} > 0
        for: 15m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Holder register not reconciled"
          description: "{{ $value }} asset(s) have holder_sync_status = BLOCKED. Map the unmapped wallet(s) or register the pool address (operator asset detail banner), then refresh holders."

      - alert: CorporateActionSnapshotBlocked
        expr: |
          registerwerk_corporate_action_snapshot_blocked{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Corporate-action entitlement snapshot refused"
          description: "{{ $value }} corporate action(s) are SNAPSHOT_BLOCKED — record date reached on a register that is not reconciled. Coupons/redemptions will not compute until the register is fixed."

      # ── Outcome-based settlement (Wave 0b C7) ─────────────────────────────
      # Live counts from the DB. A paid subscription whose mint reverted, or a redemption whose burn reverted, is
      # not an incident the user can see: the investor has paid and holds nothing / the asset is REDEEMED-pending
      # with live tokens. Both stay visible until an operator retries (settle again / resume redemption).
      - alert: SubscriptionSettlementFailed
        expr: |
          registerwerk_subscription_settlement_failed{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Subscription mint failed after payment"
          description: "{{ $value }} paid subscription order(s) are SETTLEMENT_FAILED: the mint reverted or was replaced, the investor has paid and holds no units. Settle the order again, or release it and refund."

      - alert: AssetRedemptionBurnFailed
        expr: |
          registerwerk_asset_redemption_burn_failed{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Redemption burn failed"
          description: "{{ $value }} redemption burn(s) are FAILED: the asset stays REDEMPTION_PENDING with live tokens on chain. Resume the redemption to re-dispatch the failed burns."

      # ── KYC lapse → on-chain propagation (T2-19) ──────────────────────────
      # Live count of kyc_chain_propagation rows in FAILED: a KYC expiry/rejection whose OrgRegistry
      # suspension or claim revocation keeps failing, so the entity may still pass on-chain gates.
      - alert: KycChainPropagationFailed
        expr: |
          registerwerk_kyc_chain_propagation_failed{job="registerwerk-backend"} > 0
        for: 15m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "KYC lapse not propagated on chain"
          description: "{{ $value }} KYC lapse(s) have a FAILED on-chain propagation (org suspension / KYC-AML claim revocation). The entity may still pass PermissionOracle / T-REX gates — check the kyc_chain_propagation rows and the chain signer, then let the retry job or an operator re-drive it."

      # ── Sanctions hits ────────────────────────────────────────────────────
      - alert: SanctionsHitOpenTooLong
        expr: |
          registerwerk_sanctions_oldest_open_hit_seconds{job="registerwerk-backend"} > 14400
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Open sanctions hit not resolved in 4h"
          description: "A sanctions screening hit has been open for more than 4 hours without acceptance/rejection. GwG §10 requires timely resolution."

      # ── DB connection pool ────────────────────────────────────────────────
      - alert: DBConnectionsNearExhaustion
        expr: |
          hikaricp_connections_active / hikaricp_connections_max > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB connection pool > 80% utilized"
          description: "HikariCP pool is {{ $value | humanizePercentage }} utilized. Consider increasing maximum-pool-size."

      # Threads waiting for a pooled connection. The immediate EVM submit/send/deploy paths hold
      # two connections per call and are bounded by registerwerk.blockchain.immediate-submit-
      # concurrency (default pool/4); sustained pending connections mean the pool is starved
      # (Phase 4 P4B-1) - check for long receipt waits before raising maximum-pool-size.
      - alert: DBConnectionsPending
        expr: |
          hikaricp_connections_pending{job="registerwerk-backend"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Threads are waiting for a DB connection"
          description: "{{ $value }} thread(s) have waited for a HikariCP connection for 2+ minutes."

      - alert: ImmediateEvmSubmissionRejected
        expr: |
          increase(registerwerk_tx_immediate_rejected_total{job="registerwerk-backend"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Immediate EVM submissions rejected (all slots busy)"
          description: "Callers were turned away with HTTP 503 because every immediate submit/send/deploy slot was in use. Move the callers to the durable outbox or raise registerwerk.blockchain.immediate-submit-concurrency together with the pool size."

      # ── EVM pre-signing refusals ──────────────────────────────────────────
      - alert: EvmSubmissionRefused
        expr: |
          increase(registerwerk_tx_submission_refused_total{job="registerwerk-backend"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "EVM transaction refused before signing ({{ $labels.kind }} on {{ $labels.chain }})"
          description: "A transaction was refused by a hard safety check: FEE_CEILING/TIP_CEILING/GAS_CEILING (node-reported fees above chain_config.max_fee_per_gas_wei / max_priority_fee_per_gas_wei or the global default cap - a manipulated or broken RPC node, or a genuine fee spike that needs an operator decision) or CHAIN_ID_UNPINNED/CHAIN_ID_MISMATCH (chain_config.chain_id missing, or a node answers a different chain id). See the TX_SUBMISSION_REFUSED_* audit events."

      # ── RPC node trust (Phase 4 K5) ───────────────────────────────────────
      - alert: RpcSecondSourceMismatch
        expr: |
          increase(registerwerk_confirmation_second_source_mismatch_total{job="registerwerk-backend"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Two RPC nodes of {{ $labels.chain }} disagree about a registry-mutating transaction"
          description: "A transaction is held because another healthy node reports a different block hash, recipient or sender than the receipt. Treat as a possible hostile or forked node: check RPC node health (health_reason), quarantine the suspect node under step-up + second approver, see the ERROR log line 'Second-source MISMATCH'."

      - alert: RpcSecondSourceHoldOverdue
        expr: |
          increase(registerwerk_confirmation_second_source_hold_overdue_total{job="registerwerk-backend"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A registry transaction on {{ $labels.chain }} waits for a second RPC node that never answers"
          description: "The transaction is mined and final but held (PENDING) because fewer than two healthy nodes confirm it. Repair or add an independent node; see the ERROR log 'Second-source confirmation ... still pending'."

      - alert: RpcSingleSourceConfirmation
        expr: |
          increase(registerwerk_confirmation_single_source_total{job="registerwerk-backend"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Registry transactions on {{ $labels.chain }} were confirmed from a single RPC node"
          description: "Fewer than two healthy nodes were available, so the second-source receipt cross-check was skipped. Add or repair a second independent node."

      - alert: EvmChainIdUnpinned
        expr: registerwerk_evm_chains_unpinned{job="registerwerk-backend"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "An EVM chain with confirmed deployments has no chain_id; all signing on it is refused"
          description: "Transactions are pinned to chain_config.chain_id and refused when it is NULL. Set chainId on the chain (PATCH /api/v1/admin/chains/{id}); the ERROR log 'have CONFIRMED deployments but no chain_id' lists the chains."

      - alert: RpcNodeChainMismatch
        expr: |
          increase(registerwerk_rpc_chain_mismatch_total{job="registerwerk-backend"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "An RPC node of {{ $labels.chain }} answers with another chain id or genesis hash"
          description: "The node is quarantined (health_reason CHAIN_MISMATCH) and never routed to. Verify who configured it; after a legitimate devnet reset use POST /api/v1/admin/chains/{chainId}/nodes/genesis-pin/reset."

      # ── Durable EVM outbox (P4B-4) ────────────────────────────────────────
      # A signed payload that cannot be broadcast, or a transaction dropped from the mempool, blocks every
      # later transaction of that signer. Gauges are refreshed every minute by OutboxRecoveryService.
      - alert: EvmOutboxPreparedStuck
        expr: |
          registerwerk_outbox_oldest_prepared_age_seconds{job="registerwerk-backend"} > 600
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Signer {{ $labels.signer }} (chain id {{ $labels.chain_id }}) has a PREPARED payload older than 10 minutes"
          description: "A signed transaction has not been accepted by any node for 10+ minutes. Fee-related failures of allow-listed non-regulatory calls are re-priced automatically; everything else (in particular regulatory operations) needs an operator: GET /api/v1/admin/chains/{chainConfigId}/outbox/stuck, then cancel or re-price under step-up + 4-eyes. See the EVM_OUTBOX_STUCK_DETECTED audit events."

      - alert: EvmOutboxBroadcastStuck
        expr: |
          registerwerk_outbox_stuck_count{job="registerwerk-backend"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Signer {{ $labels.signer }} has {{ $value }} outbox transaction(s) without a receipt for 10+ minutes"
          description: "Broadcast (or prepared) transactions are not being mined. The stored bytes are re-broadcast automatically; if the fee is too low the operator must re-price or cancel the payload. A timed-out transaction is not a failure and must not be resubmitted blindly."

      - alert: EvmNonceLeaseRepaired
        expr: |
          increase(registerwerk_outbox_lease_repaired_total{job="registerwerk-backend"}[30m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A stale nonce lease was capped back to the chain value (chain id {{ $labels.chain }})"
          description: "A signer's nonce lease led the chain's pending count with no outbox row holding the gap: a transaction was dropped from the mempool. The lease was repaired; check the affected TIMEOUT transactions."

      - alert: BlockchainTxLateMined
        expr: |
          increase(registerwerk_blockchain_tx_late_mined_total{job="registerwerk-backend"}[30m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "A transaction marked TIMEOUT was mined after all ({{ $labels.outcome }})"
          description: "TIMEOUT is not terminal: the poller reconciled a late receipt. See the BLOCKCHAIN_TX_LATE_MINED_* audit events."

      # ── Audit signing key age ─────────────────────────────────────────────
      # Renamed from "JwtSigningKeyAgeWarning": the JWT decoder's HS256 secret is a static
      # config value with no real "created at" concept to track. registerwerk_audit_signing_key
      # _age_seconds (AuditChainVerificationService) tracks the audit hash-chain's Ed25519
      # signing key instead — a real rotatable key where "hasn't been rotated in 90+ days" is
      # meaningful .
      - alert: AuditSigningKeyAgeWarning
        expr: |
          registerwerk_audit_signing_key_age_seconds{job="registerwerk-backend"} > 7776000
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Audit-chain signing key older than 90 days"
          description: "The Ed25519 audit-chain signing key has not been rotated in 90+ days. Rotate per security policy."

      # ── Backup staleness (eWpRV §6 / DORA Art. 12) ────────────────────────
      # backup_last_success_timestamp is pushed to a Pushgateway by the backup CronJob/cron
      # script on success (see docs/operator/maintenance/backups.md) — it only exists if a
      # Pushgateway is actually deployed and configured; this rule has no effect otherwise.
      - alert: BackupStale
        expr: |
          (time() - backup_last_success_timestamp > 86400) or absent(backup_last_success_timestamp)
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "PostgreSQL backup has not run in over 24 hours (or never reported)"
          description: "No successful backup reported in the last 24h, or the metric is absent altogether. Verify the backup CronJob/cron script and its Pushgateway connectivity."

      # Same condition seen from the other side: the series vanished (Pushgateway restarted
      # without persistence, wrong job name) and has been gone for 2 days.
      - alert: BackupMetricAbsent
        expr: |
          absent_over_time(backup_last_success_timestamp[2d])
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "No backup success metric for 2 days"
          description: "backup_last_success_timestamp has not existed for 2 days. Backups may be running but unreported, or not running at all."

  - name: registerwerk.availability
    interval: 1m
    rules:
      - alert: BackendDown
        expr: |
          up{job="registerwerk-backend"} == 0
        for: 1m
        labels:
          severity: critical
          dora_category: AVAILABILITY
        annotations:
          summary: "Registerwerk backend is down"
          description: "The backend has been unreachable for 1 minute. eWpRV §6 availability ≥99.5% SLO at risk."

  # Reconciliation and background-job alerts backed by application metrics.
  - name: registerwerk.reconciliation
    interval: 1m
    rules:

      # ── Confidential-token reconciliation (eWpG §16) ───────────────────────
      # ConfidentialBalanceReconciliationService — no dedicated table records mismatches
      # (unlike chain_drift_event), so this is an in-memory last-run snapshot, not a live query.
      - alert: ConfidentialReconciliationMismatchDetected
        expr: |
          registerwerk_confidential_reconciliation_mismatch_total{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
          dora_category: CHAIN_DRIFT
        annotations:
          summary: "Confidential-token register/chain mismatch detected"
          description: "{{ $value }} confidential-asset holder(s) mismatched in the most recent reconciliation run — decrypted on-chain balance disagrees with the eWpG §16 register."

      - alert: ConfidentialReconciliationStale
        expr: |
          time() - registerwerk_confidential_reconciliation_last_run_timestamp_seconds{job="registerwerk-backend"} > 3600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Confidential reconciliation hasn't run in over an hour"
          description: "reconcileAll() runs every 5 minutes but no-ops silently if the Zama relayer sidecar isn't configured — this usually means that."

      # ── ERC-7540 vault request ingestion ────────────────────────────────────
      # VaultRequestIngestionService: investors request straight on the vault, so a stalled
      # ingestion means their requests never reach the operator fulfil/cancel queue.
      - alert: VaultRequestIngestionLagging
        expr: |
          registerwerk_vault_request_ingest_lag_blocks{job="registerwerk-backend"} > 5000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ERC-7540 vault request ingestion is lagging"
          description: "{{ $value }} finalized blocks not yet scanned for at least one ERC-7540 vault — new deposit/redeem requests are missing from the operator queue. Check vault_request_ingest_cursor.last_error and RPC health."

      # The lag gauge freezes while the chain head is unreadable (a caught-up vault stays at 0
      # during a full RPC outage), so ingestion failures get their own signal.
      - alert: VaultRequestIngestionFailing
        expr: |
          registerwerk_vault_request_ingest_failing_deployments{job="registerwerk-backend"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ERC-7540 vault request ingestion is failing"
          description: "{{ $value }} ERC-7540 vault(s) failed every ingestion run for 15m — new deposit/redeem requests are not reaching the operator queue. Check vault_request_ingest_cursor.last_error and RPC health."

      # ── OrgIdentity onchain reconciliation ──────────────────────────────────
      # OrgChainReconciliationService / PermissionChainReconciliationService — no dedicated
      # table either; reset-then-recount-per-sweep gauges, same rationale as above.
      - alert: OrgChainDriftDetected
        expr: |
          registerwerk_org_chain_drift_open_total{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Org registration/wallet drift vs. onchain OrgRegistry"
          description: "{{ $value }} org registration(s)/member wallet(s) disagree with onchain OrgRegistry state in the most recent reconciliation sweep."

      - alert: PermissionChainDriftDetected
        expr: |
          registerwerk_permission_chain_drift_open_total{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Permission-grant drift vs. onchain PermissionRegistry"
          description: "{{ $value }} permission grant(s) disagree with onchain PermissionRegistry state — includes role-restriction flips, the most dangerous drift this job watches for."

      # ── Screening failures (distinct from SanctionsHitOpenTooLong above, which tracks
      # unresolved HITS, not provider-call failures) ──────────────────────────
      - alert: ScreeningErrorsElevated
        expr: |
          registerwerk_screening_errors_recent_total{job="registerwerk-backend"} > 5
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Elevated sanctions/PEP screening provider errors"
          description: "{{ $value }} ScreeningRun(s) failed (status=ERROR) in the last 24h. ScreeningGateImpl fails closed on this — new-entity approvals may be silently blocked."

      - alert: ScreeningPeriodicRefreshFailures
        expr: |
          registerwerk_screening_periodic_refresh_last_failures{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Daily periodic re-screening had failures"
          description: "{{ $value }} entit(y/ies) failed re-screening in the most recent daily periodic refresh (GwG §10 ongoing monitoring)."

      # ── DORA deadline breaches (Art. 19) ─────────────────────────────────────
      - alert: DoraDeadlineBreach
        expr: |
          sum by (breach_type) (registerwerk_dora_deadline_breaches{job="registerwerk-backend"}) > 0
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "DORA reporting deadline breach"
          description: "{{ $value }} overdue DORA deadline(s)/resilience test(s) of type {{ $labels.breach_type }}."

      # Early warning (interim for parked T7-06: lead time and recipients are not decided; this
      # goes to the existing warning receiver). Gauge = seconds to the next open, not yet breached deadline.
      - alert: DoraDeadlineDueSoon
        expr: |
          registerwerk_dora_deadline_due_seconds{job="registerwerk-backend"} < 3600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "DORA deadline due within one hour"
          description: "A {{ $labels.breach_type }} deadline is due in {{ $value | humanizeDuration }}."

      # ── Regulatory-report staleness ──────────────────────────────────────────
      - alert: RegReportSubmissionsStale
        expr: |
          registerwerk_regreport_stale_submissions_total{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Regulatory report submissions stuck without acknowledgement"
          description: "{{ $value }} submission(s) have had no acknowledgement beyond the configured staleness threshold."

      # ── Travel Rule (TFR Art. 14) ─────────────────────────────────────────────
      - alert: TravelRuleMessageSendFailures
        expr: |
          registerwerk_travelrule_failed_messages_recent_total{job="registerwerk-backend"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Travel Rule message send failures"
          description: "{{ $value }} travel_rule_message(s) FAILED to send in the last 24h — TFR Art. 14 requires originator/beneficiary information on every CASP-to-CASP transfer."

      # ── Notification delivery ────────────────────────────────────────────────
      # A Counter (not a gauge, unlike everything else in this group) — no persisted state
      # backs email delivery at all, so increase() over a window is the only viable query.
      - alert: EmailDeliveryFailuresElevated
        expr: |
          increase(registerwerk_notification_email_send_failures_total{job="registerwerk-backend"}[1h]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Elevated email delivery failures"
          description: "More than 5 email send failures in the last hour (see context label: generic vs. statement_pdf)."

      # ── RPC node health ───────────────────────────────────────────────────────
      - alert: RpcNodesUnhealthy
        expr: |
          registerwerk_rpc_nodes_unhealthy_total{job="registerwerk-backend"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "One or more RPC nodes unhealthy"
          description: "{{ $value }} RpcNode(s) currently marked unhealthy. May have automatic failover — escalate if a whole chain's nodes are affected."

  # (production-readiness observability pass): every rule below backs a metric that
  # exists as of this pass — registerwerk_indexer_lag_blocks, registerwerk_event_publication_backlog,
  # registerwerk_shedlock_oldest_held_lock_age_seconds, and registerwerk_scheduled_job_seconds
  # (from ScheduledJobMetricsAspect, instrumenting all 41 @Scheduled jobs) — none of these existed
  # before this pass; see IndexerMonitorService/OperationalMetricsJob/ScheduledJobMetricsAspect.
  - name: registerwerk.observability
    interval: 1m
    rules:

      # ── Indexer lag (blocks) ─────────────────────────────────────────────────
      # Complements IndexerStaleCritical/Warning (time-since-last-sync) with a depth signal: a
      # chain that syncs a small batch every tick can look "not stale" by timestamp alone while
      # still falling further behind the chain head every run.
      - alert: IndexerLagBlocksHigh
        expr: |
          registerwerk_indexer_lag_blocks{job="registerwerk-backend"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Indexer more than 1000 blocks behind chain head"
          description: "Indexer type {{ $labels.indexer_type }} (chain_config_id={{ $labels.chain_config_id }}) is {{ $value }} blocks behind the best known healthy RPC node's head, sustained for 10+ minutes."

      # ── Spring Modulith event-publication backlog ────────────────────────────
      - alert: EventPublicationBacklogGrowing
        expr: |
          registerwerk_event_publication_backlog{job="registerwerk-backend"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Spring Modulith event-publication backlog is elevated"
          description: "{{ $value }} event_publication row(s) not yet completed, sustained for 15+ minutes — a listener may be stuck failing (republish-outstanding-events-on-restart only retries on restart, not automatically)."

      # ── ShedLock stuck lock ───────────────────────────────────────────────────
      - alert: ShedLockStuckLock
        expr: |
          registerwerk_shedlock_oldest_held_lock_age_seconds{job="registerwerk-backend"} > 1800
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A ShedLock row has been held for over 30 minutes"
          description: "The oldest currently-held shedlock row is {{ $value | humanizeDuration }} old. Every scheduled job in this app is ShedLock-serialized fleet-wide, so a stuck lock silently stops that job running on ANY replica until it expires (lockAtMostFor) or is manually cleared."

      # ── Scheduled-job failures (any of the 41 @Scheduled jobs) ───────────────
      - alert: ScheduledJobFailuresElevated
        expr: |
          increase(registerwerk_scheduled_job_seconds_count{job="registerwerk-backend", outcome="failure"}[1h]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A scheduled job has failed more than 3 times in the last hour"
          description: "job={{ $labels.job }} outcome=failure — see application logs for the exception; ShedLock ensures this reflects only actual executions on the leader replica, not skipped ticks."

      # ── Reorg depth (ReorgGuard) ──────────────────────────────────────────────
      - alert: DeepReorgDetected
        expr: |
          increase(registerwerk_reorg_detected_total{job="registerwerk-backend", severity="crosses_finalized"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Reorg reached an already-FINALIZED block"
          description: "A chain reorg orphaned a row this registry had already treated as FINALIZED — deeper than the configured confirmation policy guarantees. This is a consensus failure, not routine reorg noise; manual review required (see ReorgGuard's CRITICAL log line for the affected chain/block)."

      - alert: ReorgCrossedSafeThreshold
        expr: |
          increase(registerwerk_reorg_detected_total{job="registerwerk-backend", severity="crosses_safe"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Reorg reached an already-SAFE block"
          description: "A chain reorg orphaned a row already promoted to SAFE — still within the confirmation policy's guarantee, but deeper than a purely-PROVISIONAL reorg. Worth a look, not yet a consensus failure."

      # ── Chain-effect compensation escalation (CompensationDispatcher) ────────
      # No compensator registered, a compensator failed after retries, or an effect was found
      # IRREVERSIBLE — every case leaves FinalityGate frozen on the affected asset
      # (UNRESOLVED_COMPENSATION) until an admin acknowledges it via the operator "Unresolved
      # Compensation" queue. Without this alert, that freeze is a dashboard nobody watches until a
      # trader/issuer notices their actions are blocked — see the portfolio plan's own warning.
      - alert: CompensationEscalated
        expr: |
          increase(registerwerk_compensation_escalated_total{job="registerwerk-backend"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A reorg-caused compensation could not resolve automatically"
          description: "A chain_effect row failed to compensate, or was found irreversible, or has no registered compensator for its effect_type. The affected asset is frozen (blocks every gated operation) until an operator reviews and acknowledges it in the Unresolved Compensation queue."

      # ── Blockchain tx submission -> confirmation latency (SLO-style) ─────────
      - alert: BlockchainTxConfirmationLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(registerwerk_blockchain_tx_confirmation_latency_seconds_bucket{job="registerwerk-backend"}[15m]))
            by (le, chain)
          ) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 blockchain tx submission-to-confirmation latency exceeds 5 minutes"
          description: "chain={{ $labels.chain }} p95 is {{ $value | humanizeDuration }}, sustained for 10+ minutes — check RPC node health and the configured confirmation depth for this chain."

      # ── API latency SLO (RED metrics, enabled this pass) ─────────────────────
      - alert: ApiLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket{job="registerwerk-backend"}[5m]))
            by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency exceeds 1s"
          description: "p95 request latency is {{ $value | humanizeDuration }}, sustained for 10+ minutes across all endpoints."

  # ── Meta-monitoring, absence and platform coverage (Phase 7 7B-06 / 7B-04 / 7A-11) ──────────
  - name: registerwerk.meta
    interval: 1m
    rules:
      # Dead-man's switch: always firing. Route it to a receiver that ALERTS WHEN IT STOPS
      # arriving (e.g. deadmansnitch / healthchecks.io); a silent alerting plane is the failure
      # this exists to detect.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline heartbeat"
          description: "Always firing. If the dead-man receiver stops getting this, the alerting plane is broken."

      - alert: AuditChainMetricAbsent
        expr: absent_over_time(registerwerk_audit_chain_valid{job="registerwerk-backend"}[15m])
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Audit chain gauge missing for 15 minutes"
          description: "registerwerk_audit_chain_valid is absent: backend not scraped or the verifier is not registered."

      - alert: IndexerMonitorMetricAbsent
        expr: absent_over_time(registerwerk_indexer_last_sync_timestamp_seconds[15m])
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Indexer liveness gauge missing for 15 minutes"
          description: "No indexer reports a last-sync timestamp; IndexerStale* alerts cannot fire without the series."

      - alert: OutboxMetricAbsent
        expr: absent_over_time(registerwerk_outbox_stuck_count{job="registerwerk-backend"}[15m])
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "EVM outbox gauge missing for 15 minutes"
          description: "registerwerk_outbox_stuck_count is absent; outbox stuck alerts are blind."

      - alert: DoraMetricAbsent
        expr: absent_over_time(registerwerk_dora_deadline_breaches{job="registerwerk-backend"}[15m])
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "DORA deadline gauge missing for 15 minutes"
          description: "registerwerk_dora_deadline_breaches is absent; DoraDeadlineBreach cannot fire."

      - alert: ScrapeTargetDown
        expr: up{job=~"kong|postgres|pushgateway"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }}) for 5 minutes."

      - alert: BackupPushStale
        expr: time() - push_time_seconds{job="registerwerk_pg_backup"} > 90000
        for: 0m
        labels:
          severity: critical
          dora_category: DATA_INTEGRITY
        annotations:
          summary: "Backup job has not pushed in over 25 hours"
          description: "The Pushgateway group registerwerk_pg_backup was last updated more than 25h ago."

      # Kong's rate-limiting runs fault_tolerant (fail open): if Redis is unreachable every
      # request is allowed through unthrottled and nothing else says so. redis_up needs a
      # redis_exporter scrape job (job="redis"); without one this rule has no data.
      - alert: KongRateLimitRedisDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis behind Kong rate limiting is down"
          description: "Kong's rate-limiting plugin fails open without Redis: the API is currently unthrottled."

      # ── Platform: default partitions, event publication (L1 gauges) ───────────────────────
      - alert: PartitionDefaultRowsPresent
        expr: |
          registerwerk_partition_default_rows{job="registerwerk-backend"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rows in the DEFAULT partition of {{ $labels.table }}"
          description: "{{ $value }} row(s) sit in {{ $labels.table }}_default. A row there blocks creating its month's partition. See docs/operator/maintenance runbook: detach default, create month, insert-select, reattach."

      - alert: EventPublicationIncomplete
        expr: |
          registerwerk_event_publication_incomplete{job="registerwerk-backend"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Incomplete event publications older than 10 minutes"
          description: "{{ $value }} publication(s) for listener family {{ $labels.listener }} are incomplete (a listener keeps failing)."

      - alert: ConfigDefaultTrustedProxies
        expr: |
          registerwerk_config_default_trusted_proxies{job="registerwerk-backend"} == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "trusted-proxies is the built-in default"
          description: "registerwerk.auth.trusted-proxies still covers all private ranges; set REGISTERWERK_AUTH_TRUSTED_PROXIES to your proxy network."
