global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: registerwerk-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: registerwerk-backend

  # Kong's Status API, not its Admin API. Admin stays bound to 127.0.0.1 inside the Kong
  # container, so the previous kong:8001 target was unreachable from here by construction.
  - job_name: kong
    static_configs:
      - targets: ["kong:8100"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Scrapes whatever a backup job has pushed since ephemeral CronJob pods can't be scraped
  # directly — see pushgateway's comment in docker-compose.yml. honor_labels keeps the pushed
  # "job" label (e.g. registerwerk_pg_backup) instead of Prometheus overwriting it with
  # "pushgateway".
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
