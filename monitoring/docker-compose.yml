# This stack is intentionally separate from the root docker-compose.yml (started via
# `docker compose -f monitoring/docker-compose.yml up -d`, per docs/operator/maintenance/
# monitoring.md) — but it must run ON the main stack's network to reach backend:8080/
# kong:8001, and the main stack must already be up first (registerwerk_default must exist).
# Previously this file declared no network at all, so Compose gave it its own separate
# "monitoring_default" network and every scrape target in prometheus.yml was unreachable
# by construction (Phase 12, finding #4).
networks:
  default:
    name: registerwerk_default
    external: true

services:
  # ─── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  # ─── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.4.6
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  # ─── Loki ──────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.4
    volumes:
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  # ─── Promtail (log shipper) ────────────────────────────────────────────────
  promtail:
    # NOTE: Promtail is end-of-life. Loki has moved on to 3.7.x while promtail stopped at 3.6.x;
    # Grafana's replacement is Alloy (grafana/alloy), which subsumes promtail's scrape config.
    # 3.6.11 is the last release — pinned here so the stack keeps working, but migrating this
    # service to Alloy is a tracked follow-up, not something to defer indefinitely.
    image: grafana/promtail:3.6.11
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]
    restart: unless-stopped

  # ─── Tempo (distributed tracing) ───────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.9.4
    volumes:
      - ./tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo/config.yml
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    restart: unless-stopped

  # ─── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.33.1
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  # ─── Postgres exporter ─────────────────────────────────────────────────────
  # prometheus.yml's "postgres" scrape job referenced this target already; the service
  # itself was never defined anywhere (Phase 12, finding #4).
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-registerwerk}:${DB_PASSWORD:-registerwerk}@postgres:5432/registerwerk?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    restart: unless-stopped

  # ─── Node exporter ──────────────────────────────────────────────────────────
  # Same gap as postgres-exporter — referenced by prometheus.yml's "node" job, never defined.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
