# This stack is intentionally separate from the root docker-compose.yml (started via
# `docker compose -f monitoring/docker-compose.yml up -d`, per docs/operator/maintenance/
# monitoring.md) — but it must run ON the main stack's network to reach backend:8080/
# kong:8001, and the main stack must already be up first (registerwerk_default must exist).
# Previously this file declared no network at all, so Compose gave it its own separate
# "monitoring_default" network and every scrape target in prometheus.yml was unreachable
# by construction .
networks:
  default:
    name: registerwerk_default
    external: true

services:
  # ─── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-49090}:9090"
    restart: unless-stopped

  # ─── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-43000}:3000"
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  # ─── Loki ──────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.8
    volumes:
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-43100}:3100"
    restart: unless-stopped

  # ─── Alloy (log shipper) ───────────────────────────────────────────────────
  # Grafana Alloy replaced Promtail, which is end-of-life (3.6.11 was its last release). alloy.alloy is the
  # same discovery and the same labels, rewritten in Alloy's syntax. It discovers containers and reads their
  # logs through the Docker daemon, so the socket mount is all it needs: without it nothing ever ships to Loki.
  alloy:
    image: grafana/alloy:v1.21.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on: [loki]
    restart: unless-stopped

  # ─── Tempo (distributed tracing) ───────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.10.8
    volumes:
      - ./tempo.yml:/etc/tempo/config.yml:ro
      # Tempo 2.10 runs as a non-root user: /var/tempo is the directory its image owns, so a fresh named volume
      # is writable. (Up to 2.9 the data lived in /tmp/tempo, which a root-owned volume made unwritable for it;
      # traces kept there are not migrated, they only live for the 14-day block_retention anyway.)
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yml
    ports:
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-44317}:4317"   # OTLP gRPC
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-44318}:4318"   # OTLP HTTP
    restart: unless-stopped

  # ─── Pushgateway ────────────────────────────────────────────────────────────
  # Nothing in the Compose stack pushes a backup success metric today (there is no Compose-side
  # backup job — WAL-G backup runs only as a k8s CronJob, see deploy/helm/backup/), so this is
  # scaffolding: it completes the same monitoring path as the Helm chart's pushgateway.yaml and
  # gives BackupStale (monitoring/alerts/registerwerk.yml) a real target to scrape once a backup
  # job exists here, rather than the alert silently having no data source at all.
  pushgateway:
    image: prom/pushgateway:v1.11.4
    ports:
      - "127.0.0.1:${PUSHGATEWAY_HOST_PORT:-49091}:9091"
    restart: unless-stopped

  # ─── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.34.1
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-49093}:9093"
    restart: unless-stopped

  # ─── Postgres exporter ─────────────────────────────────────────────────────
  # prometheus.yml's "postgres" scrape job referenced this target already; the service
  # itself was never defined anywhere .
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-registerwerk}:${DB_PASSWORD:-registerwerk}@postgres:5432/registerwerk?sslmode=disable"
    ports:
      - "127.0.0.1:${POSTGRES_EXPORTER_HOST_PORT:-49187}:9187"
    restart: unless-stopped

  # ─── Node exporter ──────────────────────────────────────────────────────────
  # Same gap as postgres-exporter — referenced by prometheus.yml's "node" job, never defined.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "127.0.0.1:${NODE_EXPORTER_HOST_PORT:-49100}:9100"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alloy_data:
