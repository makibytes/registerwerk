# Alertmanager's own config format has NO env-var interpolation — the ${VAR:default} syntax
# previously used below for webhook/PagerDuty/Slack URLs is never substituted at all (the
# monitoring/docker-compose.yml alertmanager service runs the stock image with no envsubst
# wrapper), so the literal string "${ALERTMANAGER_PAGERDUTY_KEY:changeme}" would have been sent
# to PagerDuty verbatim as the service_key . Same convention as
# gateway/kong.yml: edit the placeholder values below directly, or render this file with your
# own deployment tooling before mounting it.
global:
  resolve_timeout: 5m
  pagerduty_url: https://events.pagerduty.com/v2/enqueue

route:
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    # Dead-man's switch: the Watchdog alert always fires; the receiver below must page when it
    # STOPS arriving. Short repeat so a dead pipeline is noticed quickly.
    - match:
        alertname: Watchdog
      receiver: deadman
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - match:
        severity: critical
      receiver: critical-pagerduty
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: warning-slack
      repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: "http://localhost:9094"  # EDIT ME — default receiver's webhook target
        send_resolved: true

  - name: deadman
    webhook_configs:
      - url: "http://localhost:9095"  # EDIT ME — dead-man's-switch endpoint (healthchecks.io / deadmansnitch URL)
        send_resolved: false

  - name: critical-pagerduty
    pagerduty_configs:
      - service_key: "changeme"  # EDIT ME — PagerDuty integration key
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'
        details:
          description: '{{ .CommonAnnotations.description }}'
          severity: '{{ .CommonLabels.severity }}'
          dora_category: '{{ .CommonLabels.dora_category }}'

  - name: warning-slack
    slack_configs:
      - api_url: "https://hooks.slack.com/services/CHANGEME"  # EDIT ME — Slack incoming webhook URL
        channel: '#registerwerk-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname]
