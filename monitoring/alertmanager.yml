global:
  resolve_timeout: 5m
  # Configure PagerDuty or Opsgenie integration key via env var ALERTMANAGER_PAGERDUTY_KEY
  pagerduty_url: https://events.pagerduty.com/v2/enqueue

route:
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical-pagerduty
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: warning-slack
      repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: ${ALERTMANAGER_WEBHOOK_URL:http://localhost:9094}
        send_resolved: true

  - name: critical-pagerduty
    pagerduty_configs:
      - service_key: ${ALERTMANAGER_PAGERDUTY_KEY:changeme}
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'
        details:
          description: '{{ .CommonAnnotations.description }}'
          severity: '{{ .CommonLabels.severity }}'
          dora_category: '{{ .CommonLabels.dora_category }}'

  - name: warning-slack
    slack_configs:
      - api_url: ${ALERTMANAGER_SLACK_WEBHOOK:}
        channel: '#registerwerk-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname]
