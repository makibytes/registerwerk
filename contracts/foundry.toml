[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
# Registerwerk targets Glamsterdam-era EVM chains only (Ethereum's Glamsterdam upgrade = the
# "Amsterdam" execution-layer fork in solc/forge) and is NOT compatible with pre-Glamsterdam chains:
#   * EIP-7954 raises the contract-size limits to 64 KiB runtime / 128 KiB initcode;
#   * EIP-8037 / EIP-8038 reprice state: a new storage slot costs ~110k gas (was 22k), every byte of
#     deployed code 1,530 gas (was 200), a new account ~196k; STORAGE_WRITE is 10,000 and a cold
#     account access 3,000. Gas budgets in the tests and in the backend/frontend were re-derived for it.
# solc 0.8.37 only offers "amsterdam" as an experimental target (hence `experimental = true`, which
# forge >= 1.8.5 passes to solc); forge's revm applies the Amsterdam gas schedule when it is set.
# Pinned explicitly rather than left to the toolchain default, so it cannot drift silently.
evm_version = "amsterdam"
experimental = true
# Required for EwpgPasskeyAccount (WebAuthn/P256 signature parsing hits "stack too deep"
# without it) — matches the vendored openzeppelin-contracts lib's own default settings.
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "@erc3643/=lib/erc3643/contracts/",
    "@onchain-id/solidity/=lib/onchain-id/",
    "@fhevm/=lib/fhevm/",
    # eth-infinitism/account-abstraction v0.8.0 (GPL-3.0 / MIT): a pinned submodule used ONLY by
    # test/ecosystem/EwpgPaymaster.t.sol to instantiate the real EntryPoint; nothing in src/ or script/
    # imports it, so it is never deployed or shipped with the repo's own (proprietary) sources.
    "@account-abstraction/contracts/=lib/account-abstraction/contracts/"
]
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "write", path = "/output" }
]

[rpc_endpoints]
fhenix_helium = "${FHENIX_HELIUM_RPC}"
inco_rivest   = "${INCO_RIVEST_RPC}"

# Used by contracts/test/lending/EwpgRepoMarket.invariant.t.sol — the
# repo markets are the first contracts in this codebase to move real pooled stablecoin/collateral
# value with nontrivial internal accounting (scaled shares/debt, a bad-debt write-off), so a
# fuzzed handler run is worth the extra CI time relative to the ordinary unit-test suite.
[invariant]
runs = 256
depth = 20
fail_on_revert = false
