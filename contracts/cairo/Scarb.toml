[package]
name = "registerwerk_cairo"
version = "0.1.0"
edition = "2024_07"

# Cairo compiler target: Sierra output for Starknet deployment
[[target.starknet-contract]]
sierra = true

# Self-contained: both token contracts implement their full surface directly,
# so no OpenZeppelin or Carbonable base library is required.
[dependencies]
starknet = ">=2.8.0"

[dev-dependencies]
# Keep in lockstep with the installed snforge runner (`snforge --version`); the registry
# package replaces the old git-tag pin, which pulled in the whole starknet-foundry workspace.
snforge_std = "0.61.0"

[tool.snforge]
exit_first = false
