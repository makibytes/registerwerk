[package]
name = "registerwerk_cairo"
version = "0.1.0"
edition = "2024_07"

# Cairo compiler target: Sierra output for Starknet deployment
[[target.starknet-contract]]
sierra = true

# Self-contained: both token contracts implement their full surface directly,
# so no OpenZeppelin or Carbonable base library is required.
[dependencies]
starknet = ">=2.8.0"

[dev-dependencies]
# snforge >= 0.31 supports Cairo 2.8 and the cheat_caller_address / DeclareResultTrait API.
snforge_std = { git = "https://github.com/foundry-rs/starknet-foundry.git", tag = "v0.31.0" }

[tool.snforge]
exit_first = false
